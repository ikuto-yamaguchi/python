[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-predictive-lm"
version = "0.1.0"
description = "Experiments toward minimum-memory, minimum-compute predictive sequence models"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
mpm-phase1 = "minimal_predictive_lm.experiment:main"
mpm-phase2 = "minimal_predictive_lm.phase2_experiment:main"
mpm-phase3a = "minimal_predictive_lm.phase3_experiment:main"
mpm-phase4a = "minimal_predictive_lm.phase4_experiment:main"
mpm-phase5a = "minimal_predictive_lm.phase5_experiment:main"
mpm-phase6a = "minimal_predictive_lm.phase6_experiment:main"
mpm-phase6c = "minimal_predictive_lm.phase6c_experiment:main"
mpm-phase7a = "minimal_predictive_lm.phase7_experiment:main"
mpm-phase8a = "minimal_predictive_lm.phase8_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
