[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sem-tiny-abn"
version = "0.2.0"
description = "Lightweight ABN for paired SEM/design OK-NG inspection"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1,<3",
  "numpy>=1.24,<3",
  "pillow>=10,<13",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "scikit-learn>=1.3,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
onnx = ["onnx>=1.14,<2", "onnxruntime>=1.16,<2"]

[tool.setuptools]
packages = ["sem_tiny_abn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
