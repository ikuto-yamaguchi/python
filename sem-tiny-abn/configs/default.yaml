# SEM Tiny ABN 厳密レビュー後の推奨設定
# 基本的にはこのファイルだけを編集して実行します。

data_root: /path/to/画像フォルダ
csv: /path/to/annotations.csv
out: runs/sem_tiny_abn

classes: OK,NG
task: multiclass

# tiny_cnn / tiny_abn / tiny_freq_abn
model: tiny_abn

# SEM, soft design, 許容帯付きpos/neg差分
input_mode: sem_design_posneg
image_size: 512
normalize_mode: percentile

# SEMの白黒極性が全データで一定なら true/false に固定する方が安全です。
# 不明な初回検証だけ auto を使えます。
sem_invert: auto
design_invert: false

# DesignをSEMの見え方へ少し寄せる。
design_blur_radius: 1.0

# このピクセル以内の位置ずれは差分チャンネルで許容する。
# 512画像で2pxを初期値とし、実データで1/2/3pxを比較してください。
diff_tolerance_px: 2

# 0ならキャッシュなし。画像数が少なくRAMに余裕があれば増やせます。
cache_size: 0

# モデル規模。精度不足なら width → depth の順で増やす。
width: 1.0
depth: 1

# batch size 1でも安定するGroupNormを標準にする。
norm: group

# standardはCPU実測で速い場合が多い通常Residual Conv。
# mobileはパラメータを減らせるが、CPUで必ず速いとは限りません。
block_type: standard
expansion: 2.0
pooling: avgmax
dropout: 0.1

# 学習
epochs: 60
batch_size: 4
lr: 0.001
weight_decay: 0.0001
optimizer: adamw
momentum: 0.9
warmup_epochs: 3

# 本家ABNと同様、Attention branchとPerception branchを同時に学習する。
aux_weight: 1.0

# 最初は通常CrossEntropyを推奨。難例不足を確認してから変更する。
focal_gamma: 0.0
label_smoothing: 0.0
class_weight_mode: none
grad_clip_norm: 5.0

# CSVにsplit列またはgroup/pattern_id/wafer列がない場合のみ使われる。
val_ratio: 0.2

# 検証データ上で許容するFalse OK率。0.0はFalse OKゼロを優先。
target_false_ok_rate: 0.0
early_stopping_patience: 15

num_workers: 0
device: cpu
cpu_threads: 0
seed: 42
deterministic: false
amp: false
channels_last: false
resume: null

# 評価・推論時のbatch size
eval_batch_size: 4
