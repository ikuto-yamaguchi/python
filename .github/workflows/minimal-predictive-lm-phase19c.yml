name: minimal-predictive-lm-phase19c

on:
  pull_request:
    paths:
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase19a_general_learning_reality_gate.py'
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase19c_causal_long_memory_gate.py'
      - 'minimal-predictive-lm/tests/test_phase19c_causal_long_memory_gate.py'
      - 'minimal-predictive-lm/docs/phase19c_causal_long_memory_gate.md'
      - '.github/workflows/minimal-predictive-lm-phase19c.yml'

concurrency:
  group: phase19c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase19c:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Causal long-memory theorem tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q minimal-predictive-lm/tests/test_phase19c_causal_long_memory_gate.py 2>&1 | tee phase19c-pytest.log
      - name: Run Phase 19c long-memory gate
        id: experiment
        continue-on-error: true
        working-directory: minimal-predictive-lm
        run: |
          set -o pipefail
          python -m minimal_predictive_lm.phase19c_causal_long_memory_gate 2>&1 | tee ../phase19c-experiment.log
      - name: Upload Phase 19c diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase19c-results
          path: |
            minimal-predictive-lm/results/phase19c.json
            minimal-predictive-lm/results/phase19c.md
            phase19c-pytest.log
            phase19c-experiment.log
          retention-days: 7
      - name: Enforce Phase 19c gate
        if: always()
        run: |
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.experiment.outcome }}" = "success"
