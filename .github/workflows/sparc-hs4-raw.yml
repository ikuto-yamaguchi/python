name: sparc-hs4-raw

on:
  pull_request:
    branches: [research/minimal-compute-lm]
  workflow_dispatch:

jobs:
  hs4-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit tests
        run: |
          python -m pytest -q \
            minimal-predictive-lm/tests/test_sparc_raw_induction.py \
            minimal-predictive-lm/tests/test_sparc_hs4.py
      - name: Train and evaluate SPARC-HS4
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.sparc_hs4_experiment
      - name: Upload model and report
        uses: actions/upload-artifact@v4
        with:
          name: sparc-hs4-raw-results
          path: minimal-predictive-lm/results
          retention-days: 14
      - name: Enforce capability and resource gates
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results/sparc_hs4_raw_curriculum.json').read_text())
          scale = result['large_raw_curriculum']
          mining = scale['raw_mining']
          assert result['passed'] is True
          assert result['passed_checks'] == result['total_checks']
          assert result['raw_unlabeled_sentence_fit'] is True
          assert result['weak_qa_relation_alignment'] is True
          assert result['transformer_used'] is False
          assert result['softmax_attention_used'] is False
          assert result['growing_kv_cache_used'] is False
          assert mining['sentences'] == 100000
          assert mining['schemas'] == 20000
          assert mining['facts'] == 100000
          assert scale['entities'] == 201024
          assert scale['relation_edges'] == 200512
          assert scale['correct_queries'] == scale['sample_queries'] == 512
          assert scale['max_schema_candidates_observed'] <= 64
          assert scale['max_anchor_reads_observed'] <= 256
          assert scale['raw_global_sentence_scan_at_query'] is False
          assert scale['serialized_bytes'] <= 10000000
          assert result['peak_process_kib'] <= 1500000
          assert result['elapsed_seconds'] <= 120
          PY
