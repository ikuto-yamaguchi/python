name: R0D Cycle 053 apply core metric coverage

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - .github/workflows/r0d_cycle_053_apply_core_metric_coverage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/intelligence-swarm-reconstruction-001
          fetch-depth: 0

      - name: Apply fail-closed optional metric coverage to core scorer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py')
          text = path.read_text(encoding='utf-8')

          old = '''    errors, seen = [], set(); method_ids, grouped, snapshots, outcomes = defaultdict(set), defaultdict(list), defaultdict(set), defaultdict(dict)
    if invalid_dataset_splits:
'''
          new = '''    errors, seen = [], set(); method_ids, grouped, snapshots, outcomes = defaultdict(set), defaultdict(list), defaultdict(set), defaultdict(dict)
    gold_inverse_ids = {iid for iid in eval_ids if "gold_inverse" in by_id[iid]}
    pred_inverse_ids = defaultdict(set)
    if invalid_dataset_splits:
'''
          if old not in text and 'gold_inverse_ids = {iid for iid in eval_ids if "gold_inverse" in by_id[iid]}' not in text:
              raise SystemExit('score metric tracking anchor not found')
          text = text.replace(old, new, 1)

          old = '''        if "gold_inverse" in gold and "pred_inverse" in pred: item["inverse"] = float(pred["pred_inverse"] == gold["gold_inverse"])
        grouped[(method, int(gold["seed"]), str(gold["domain"]), str(gold["split"]).lower(), str(gold["condition"]))].append(item); outcomes[method][iid] = item
'''
          new = '''        if "pred_inverse" in pred:
            pred_inverse_ids[method].add(iid)
        if "gold_inverse" in gold and "pred_inverse" in pred:
            item["inverse"] = float(pred["pred_inverse"] == gold["gold_inverse"])
        grouped[(method, int(gold["seed"]), str(gold["domain"]), str(gold["split"]).lower(), str(gold["condition"]))].append(item); outcomes[method][iid] = item
'''
          if old not in text and 'pred_inverse_ids[method].add(iid)' not in text:
              raise SystemExit('inverse item anchor not found')
          text = text.replace(old, new, 1)

          old = '''    absent = required - set(method_ids)
    if absent: errors.append(f"missing required methods: {sorted(absent)}")
    shuffle_errors, shuffle_audit = _validate_shuffle_assignments(preds, by_id, eval_ids); errors.extend(shuffle_errors)
    cells = []
'''
          new = '''    absent = required - set(method_ids)
    if absent: errors.append(f"missing required methods: {sorted(absent)}")
    inverse_metric_complete = False
    if gold_inverse_ids and gold_inverse_ids != eval_ids:
        errors.append(f"gold_inverse must cover all evaluation instances or none; found {len(gold_inverse_ids)}/{len(eval_ids)}")
    elif not gold_inverse_ids:
        leaking_methods = sorted(method for method, ids in pred_inverse_ids.items() if ids)
        if leaking_methods:
            errors.append(f"pred_inverse supplied without any evaluation gold_inverse by methods {leaking_methods}")
    else:
        inverse_metric_complete = True
        for method in sorted(required):
            ids = pred_inverse_ids.get(method, set())
            missing_inverse, extra_inverse = eval_ids - ids, ids - eval_ids
            if missing_inverse:
                inverse_metric_complete = False
                errors.append(f"method {method}: incomplete pred_inverse coverage ({len(missing_inverse)} missing)")
            if extra_inverse:
                inverse_metric_complete = False
                errors.append(f"method {method}: pred_inverse outside evaluation set ({len(extra_inverse)} extra)")
    shuffle_errors, shuffle_audit = _validate_shuffle_assignments(preds, by_id, eval_ids); errors.extend(shuffle_errors)
    reportable_metrics = {"prospective", "action"} | ({"inverse"} if inverse_metric_complete else set())
    cells = []
'''
          if old not in text and 'inverse_metric_complete = False' not in text:
              raise SystemExit('coverage enforcement anchor not found')
          text = text.replace(old, new, 1)

          old = '''        for metric in sorted({k for item in items for k in item}): cell[metric] = statistics.mean(item[metric] for item in items if metric in item)
        cells.append(cell)
    metrics = sorted({k for c in cells for k in c if k in {"prospective", "action", "inverse"}}); summary, methods = defaultdict(dict), set(method_ids)
'''
          new = '''        for metric in sorted({k for item in items for k in item} & reportable_metrics):
            cell[metric] = statistics.mean(item[metric] for item in items)
        cells.append(cell)
    metrics = sorted(reportable_metrics); summary, methods = defaultdict(dict), set(method_ids)
'''
          if old not in text and 'metrics = sorted(reportable_metrics)' not in text:
              raise SystemExit('reportable metric anchor not found')
          text = text.replace(old, new, 1)

          old = '"finite_prediction_values_checked": True, "valid_action_schema_checked": True, "shuffle_assignment_audit": shuffle_audit, "cells": cells,'
          new = '"finite_prediction_values_checked": True, "valid_action_schema_checked": True, "optional_metric_coverage_required": True, "inverse_metric_complete": inverse_metric_complete, "gold_inverse_coverage": {"expected": len(eval_ids), "present": len(gold_inverse_ids)}, "pred_inverse_coverage": {method: {"expected": len(eval_ids), "present": len(pred_inverse_ids.get(method, set()))} for method in sorted(REQUIRED_METHODS)}, "shuffle_assignment_audit": shuffle_audit, "cells": cells,'
          if old not in text and '"optional_metric_coverage_required": True' not in text:
              raise SystemExit('score evidence anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add core optional metric coverage regression
        run: |
          cat > research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_metric_coverage_core.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import copy
          import importlib.util
          from pathlib import Path

          HERE = Path(__file__).resolve().parent
          SPEC = importlib.util.spec_from_file_location('evaluation_contract', HERE / 'evaluation_contract.py')
          assert SPEC and SPEC.loader
          contract = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(contract)

          METHODS = sorted(contract.REQUIRED_METHODS)
          SEEDS = sorted(contract.CANONICAL_SEEDS)


          def dataset(with_inverse=True):
              rows = []
              for seed in SEEDS:
                  rows.append({
                      'instance_id': f'train-{seed}', 'domain': 'rtfm', 'seed': seed,
                      'split': 'train', 'condition': 'in_distribution',
                      'utterance': f'train {seed}', 'state_before': {'x': 0},
                      'gold_action': 0, 'gold_state_after': {'x': 1},
                  })
                  for j in (0, 1):
                      row = {
                          'instance_id': f'test-{seed}-{j}', 'domain': 'rtfm', 'seed': seed,
                          'split': 'test', 'condition': 'in_distribution',
                          'utterance': f'test {seed} {j}', 'state_before': {'x': j + 2},
                          'gold_action': j, 'gold_state_after': {'x': j + 3},
                      }
                      if with_inverse:
                          row['gold_inverse'] = {'x': j + 2}
                      rows.append(row)
              return rows


          def predictions(rows, include_inverse=True):
              eval_rows = [contract.adapt_row(row) for row in rows if row['split'] == 'test']
              by_cell = {}
              for row in eval_rows:
                  by_cell.setdefault((row['seed'], row['domain'], row['split'], row['condition']), []).append(row)
              donors = {}
              for values in by_cell.values():
                  assert len(values) == 2
                  donors[values[0]['instance_id']] = values[1]
                  donors[values[1]['instance_id']] = values[0]
              out = []
              for row in eval_rows:
                  for method in METHODS:
                      pred = {
                          'instance_id': row['instance_id'], 'method': method,
                          'instance_fingerprint': contract.instance_fingerprint(row),
                          'pred_action': row['gold_action'], 'pred_state_after': row['gold_state_after'],
                      }
                      if include_inverse:
                          pred['pred_inverse'] = row.get('gold_inverse', {'prediction_only': True})
                      if method in contract.SHUFFLE_METHODS:
                          donor = donors[row['instance_id']]
                          pred['control_source_instance_id'] = donor['instance_id']
                          pred['control_source_fingerprint'] = contract.instance_fingerprint(donor)
                      out.append(pred)
              return out


          clean_data = dataset(with_inverse=True)
          clean_preds = predictions(clean_data, include_inverse=True)
          clean = contract.score(clean_data, clean_preds)
          assert clean['valid'], clean
          assert clean['inverse_metric_complete'] is True
          assert all('inverse' in cell for cell in clean['cells'])

          selective = copy.deepcopy(clean_preds)
          victim = next(row for row in selective if row['method'] == 'state_only')
          victim.pop('pred_inverse')
          selective_result = contract.score(clean_data, selective)
          assert not selective_result['valid'], selective_result
          assert selective_result['classification'] == 'initial_reproduction_failure'
          assert selective_result['inverse_metric_complete'] is False
          assert any('incomplete pred_inverse coverage' in error for error in selective_result['errors'])
          assert all('inverse' not in cell for cell in selective_result['cells'])
          assert all('inverse' not in values for values in selective_result['summary'].values())

          partial_gold = dataset(with_inverse=True)
          next(row for row in partial_gold if row['split'] == 'test').pop('gold_inverse')
          partial_result = contract.score(partial_gold, predictions(partial_gold, include_inverse=True))
          assert not partial_result['valid'], partial_result
          assert any('gold_inverse must cover all evaluation instances or none' in error for error in partial_result['errors'])
          assert partial_result['inverse_metric_complete'] is False

          no_gold = dataset(with_inverse=False)
          prediction_only = contract.score(no_gold, predictions(no_gold, include_inverse=True))
          assert not prediction_only['valid'], prediction_only
          assert any('pred_inverse supplied without any evaluation gold_inverse' in error for error in prediction_only['errors'])
          assert prediction_only['inverse_metric_complete'] is False

          no_inverse = contract.score(no_gold, predictions(no_gold, include_inverse=False))
          assert no_inverse['valid'], no_inverse
          assert no_inverse['inverse_metric_complete'] is False
          assert all('inverse' not in cell for cell in no_inverse['cells'])

          print('R0 core optional metric coverage regression: PASS')
          PY

      - name: Run focused regression
        run: |
          python -m py_compile \
            research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py \
            research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_metric_coverage_core.py
          python research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_metric_coverage_core.py

      - name: Record governance result
        run: |
          cat > research/intelligence_swarm/governance/REPORT_R0D_CYCLE_053.md <<'MD'
          # R0-D Cycle 053 — core optional metric coverage

          ## Scope

          R0 benchmark reproducibility, statistical validity, and leakage auditing only. No memory, replay, fast weights, sleep, forgetting, architecture, or new mechanism was added.

          ## Defect closed

          `evaluation_contract.score()` previously computed the optional inverse metric from only rows and cells where both `gold_inverse` and `pred_inverse` happened to be present. A method could omit `pred_inverse` on difficult instances while the scorer still emitted an inverse mean, confidence interval, cell gap, and paired test from the favorable remainder.

          ## Fail-closed contract

          - `gold_inverse` must exist on every evaluation instance or on none.
          - When gold inverse exists, every required method must provide `pred_inverse` for every evaluation instance.
          - When gold inverse does not exist, prediction-only inverse outputs are rejected.
          - Inverse cells, summaries, confidence intervals, and paired tests are emitted only after complete same-instance metric coverage is established.
          - Coverage counts are stored by method in the score artifact.
          - Any violation is classified as `initial_reproduction_failure`.

          ## Verification

          Focused regression covers complete inverse reporting, selective omission by state-only, partial gold coverage, prediction-only inverse output, and a valid benchmark with no inverse metric.

          ## Research status

          This closes a statistical reporting bypass only. No real R0 artifact bundle, public baseline reproduction, capability improvement, novelty, or intelligence principle is accepted or claimed.
          MD

      - name: Commit cumulative result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py \
            research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_metric_coverage_core.py \
            research/intelligence_swarm/governance/REPORT_R0D_CYCLE_053.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'r0d: enforce core optional metric coverage'
            git push origin HEAD:research/intelligence-swarm-reconstruction-001
          fi
