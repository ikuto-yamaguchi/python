name: minimal-predictive-lm-phase18d6
on:
  pull_request:
    paths:
      - 'minimal-predictive-lm/data/phase18d6_utf8_byte_stream.json'
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase18d6_utf8_byte_codec_induction.py'
      - 'minimal-predictive-lm/tests/test_phase18d6_utf8_byte_codec_induction.py'
      - 'minimal-predictive-lm/docs/phase18d6_utf8_byte_codec_induction.md'
      - '.github/workflows/minimal-predictive-lm-phase18d6.yml'
concurrency:
  group: phase18d6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase18d6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: UTF-8 byte induction theorem tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_phase18d6_utf8_byte_codec_induction.py
      - name: Run Phase 18d-6 experiment
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.phase18d6_utf8_byte_codec_induction
      - name: Upload Phase 18d-6 diagnostics and results
        uses: actions/upload-artifact@v4
        with:
          name: phase18d6-results
          path: |
            minimal-predictive-lm/results/phase18d6.json
            minimal-predictive-lm/results/phase18d6.md
          retention-days: 7
