name: minimal-predictive-lm-phase18d6
on:
  pull_request:
    paths:
      - 'minimal-predictive-lm/data/phase18d6_utf8_byte_stream.json'
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase18d6_utf8_byte_codec_induction.py'
      - 'minimal-predictive-lm/tests/test_phase18d6_utf8_byte_codec_induction.py'
      - 'minimal-predictive-lm/docs/phase18d6_utf8_byte_codec_induction.md'
      - '.github/workflows/minimal-predictive-lm-phase18d6.yml'
concurrency:
  group: phase18d6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase18d6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: UTF-8 byte induction theorem tests
        id: theorem_tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -vv minimal-predictive-lm/tests/test_phase18d6_utf8_byte_codec_induction.py 2>&1 | tee phase18d6-test.log
      - name: Run Phase 18d-6 experiment
        id: experiment
        continue-on-error: true
        working-directory: minimal-predictive-lm
        run: |
          set -o pipefail
          python -m minimal_predictive_lm.phase18d6_utf8_byte_codec_induction 2>&1 | tee phase18d6-experiment.log
      - name: Upload Phase 18d-6 diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18d6-results
          path: |
            phase18d6-test.log
            minimal-predictive-lm/phase18d6-experiment.log
            minimal-predictive-lm/results/phase18d6.json
            minimal-predictive-lm/results/phase18d6.md
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce Phase 18d-6 success
        if: always()
        run: |
          test "${{ steps.theorem_tests.outcome }}" = "success"
          test "${{ steps.experiment.outcome }}" = "success"
