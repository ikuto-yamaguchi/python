name: R0-D Cycle 084 strict seed identity

on:
  pull_request:
    branches:
      - research/intelligence-swarm-governance-014
    paths:
      - research/intelligence_swarm/governance/apply_r0d_cycle_084_strict_seed_identity.py
      - research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_strict_seed_identity_cycle_084.py
      - .github/workflows/r0d_cycle_084_strict_seed_identity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.head_ref == 'research/intelligence-swarm-reconstruction-001' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/intelligence-swarm-reconstruction-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply fail-closed core patch
        run: python research/intelligence_swarm/governance/apply_r0d_cycle_084_strict_seed_identity.py
      - name: Compile contract and regression
        run: |
          python -m py_compile research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py
          python -m py_compile research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_strict_seed_identity_cycle_084.py
      - name: Run focused regression
        run: python research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_strict_seed_identity_cycle_084.py
      - name: Commit core integration to canonical branch
        run: |
          if git diff --quiet -- research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py research/intelligence_swarm/governance/REPORT_R0D_CYCLE_084.md; then
            echo 'Core already integrated.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py research/intelligence_swarm/governance/REPORT_R0D_CYCLE_084.md
          git commit -m 'research: integrate Cycle 084 strict seed identity'
          git push origin HEAD:research/intelligence-swarm-reconstruction-001
