name: Apply HS21 minimal quality fixes

on:
  push:
    branches:
      - research/sparc-hs16-university-gate
    paths:
      - ".github/workflows/apply-hs21-v6-minimal.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sparc-hs16-university-gate
      - name: Apply line-oriented quality fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(lines, contains, name):
              matches = [i for i, line in enumerate(lines) if contains in line]
              if len(matches) != 1:
                  raise RuntimeError(f"{name}: {matches}")
              return matches[0]

          path = Path("sparc_hs16/sparc_hs16/dialogue_planner.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          idx = one(lines, 'value = re.sub(r"^(?:今日は|昨日|最近|そういえば)"', "normalize-start")
          lines[idx] = lines[idx].replace('_compact(text))', '_compact(text)).lstrip("、,")')
          idx = one(lines, 'value = re.sub(r"(?:だったよ|だよ|なんだ|でさ', "normalize-end")
          lines[idx] = '    value = re.sub(r"(?:だったよ|だよ|なんだ|んだ|でさ|だね|です|ます|よ|ね|さ)$", "", value)'
          ret = one(lines, 'return value[:limit]', "normalize-return")
          if not any('def _option_label' in line for line in lines):
              lines[ret + 1:ret + 1] = [
                  "",
                  "",
                  "def _option_label(text: str) -> str:",
                  "    value = _normalize_clause(text, 32)",
                  '    value = re.sub(r"(?:を)?(?:直す|改善する|伸ばす|進める|強化する)$", "", value)',
                  "    return value or _normalize_clause(text, 32)",
              ]

          start = one(lines, 'choice_source = " ".join', "choice-source")
          end = one(lines, 'if base.act == "empathize":', "empathize-start")
          lines[start:end] = [
              "        alternatives: tuple[str, str] | None = None",
              "        for choice_source in (frame.text, prior_text):",
              "            if not choice_source:",
              "                continue",
              "            for pattern in (",
              '                r"(.{2,28}?)と(.{2,28}?)のどちら",',
              '                r"(.{2,28}?)か[、,]?(.{2,28}?)か(?:で迷|迷って|どっち|どちら)",',
              "            ):",
              "                choice_match = re.search(pattern, _compact(choice_source))",
              "                if choice_match:",
              "                    alternatives = (",
              "                        _normalize_clause(choice_match.group(1), 28),",
              "                        _normalize_clause(choice_match.group(2), 28),",
              "                    )",
              "                    break",
              "            if alternatives:",
              "                break",
              "",
          ]

          context = one(lines, 'context_summary = summary', "context-summary")
          if not any('event_summary = summary' in line for line in lines):
              lines[context + 1:context + 1] = [
                  "        event_summary = summary",
                  "        if frame.timing:",
                  '            event_summary = summary.replace(frame.timing, "", 1).lstrip("に、,")',
              ]
          timing = one(lines, 'f"{frame.timing}に{summary}のは対応しづらいね。', "timing-text")
          lines[timing] = lines[timing].replace('{summary}', '{event_summary}', 1)

          for i, line in enumerate(lines):
              if 'f"{summary}んだね。{actor_focus}' in line:
                  lines[i] = line.replace('f"{summary}んだね。', 'f"『{summary}』という状況なんだね。')
              elif 'f"{context_summary}んだね。そこでは' in line:
                  lines[i] = line.replace('f"{context_summary}んだね。', 'f"『{context_summary}』ということなんだね。')

          dimensions = one(lines, '            if dimensions:', "dimensions")
          if not any('"causal-hypothesis"' in line for line in lines):
              lines[dimensions:dimensions] = [
                  '            if topic in {"ランニング", "マラソン"} and frame.question_type in {"question", "opinion"} and "息" in context_summary and "脚" in context_summary:',
                  "                candidates.append(Candidate(",
                  '                    "息は保てているのに脚だけ動かなくなるなら、心肺より脚の局所疲労か、前半のペースが速すぎる可能性が高そう。"',
                  '                    "まず前半を少し落とし、脚が重くなり始める距離が後ろへずれるか比べると切り分けやすい。",',
                  '                    "causal-hypothesis",',
                  "                ))",
              ]

          ordered = one(lines, 'f"今の情報なら、まず{foundation}を優先する。', "ordered-choice-text")
          append_index = ordered - 1
          if 'candidates.append' not in lines[append_index]:
              raise RuntimeError("ordered append anchor missing")
          lines[append_index:append_index] = [
              "                foundation_label = _option_label(foundation)",
              "                enhancement_label = _option_label(enhancement)",
          ]
          ordered += 2
          lines[ordered:ordered + 3] = [
              '                    f"今の情報なら、まず『{foundation}』を優先する。『{enhancement}』を進めても、"',
              '                    f"{foundation_label}が弱いと良さを受け取ってもらえないから。{foundation_label}の最低基準を通した後に、"',
              '                    f"{enhancement_label}を伸ばす順番がいいと思う。",',
          ]

          bonus = one(lines, '"commitment-experiment": 2.5', "commitment-bonus")
          lines[bonus] = lines[bonus].replace('2.5', '5.0')
          lines[bonus + 1:bonus + 1] = ['            "causal-hypothesis": 4.0,']

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python -m py_compile sparc_hs16/sparc_hs16/dialogue_planner.py
          git diff --check
      - name: Commit minimal quality fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sparc_hs16/sparc_hs16/dialogue_planner.py
          git commit -m "fix: HS21の原因応答と選択表現を改善"
          git push origin HEAD:research/sparc-hs16-university-gate
