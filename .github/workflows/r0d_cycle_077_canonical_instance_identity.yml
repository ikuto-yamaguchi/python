name: R0D Cycle 077 canonical instance identity

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - research/intelligence_swarm/benchmarks/grounded_causal/apply_r0d_cycle_077_canonical_instance_identity.py
      - research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_canonical_instance_identity_cycle_077.py
      - .github/workflows/r0d_cycle_077_canonical_instance_identity.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r0d-cycle-077-canonical-instance-identity
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/intelligence-swarm-reconstruction-001
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply fail-closed core patch
        run: python research/intelligence_swarm/benchmarks/grounded_causal/apply_r0d_cycle_077_canonical_instance_identity.py

      - name: Compile contract and regression
        run: |
          python -m py_compile \
            research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py \
            research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_canonical_instance_identity_cycle_077.py

      - name: Run focused regression
        run: python research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_canonical_instance_identity_cycle_077.py

      - name: Commit core integration to canonical branch
        run: |
          if git diff --quiet -- research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py; then
            echo "Core already integrated; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py
          git commit -m "research(r0d): integrate canonical instance identity into core"
          git push origin HEAD:research/intelligence-swarm-reconstruction-001
