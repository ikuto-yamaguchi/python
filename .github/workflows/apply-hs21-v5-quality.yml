name: Apply HS21 language and causal quality fixes

on:
  push:
    branches:
      - research/sparc-hs16-university-gate
    paths:
      - ".github/workflows/apply-hs21-v5-quality.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sparc-hs16-university-gate
      - name: Apply surface-language and causal fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(text: str, old: str, new: str, name: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{name}: expected 1, got {count}")
              return text.replace(old, new)

          path = Path("sparc_hs16/sparc_hs16/dialogue_planner.py")
          text = path.read_text(encoding="utf-8")

          text = replace_one(
              text,
              '''def _normalize_clause(text: str, limit: int = 48) -> str:
    value = re.sub(r"^(?:今日は|昨日|最近|そういえば)", "", _compact(text))
    value = re.sub(r"(?:だったよ|だよ|なんだ|でさ|だね|です|ます|よ|ね|さ)$", "", value)
    return value[:limit]
''',
              '''def _normalize_clause(text: str, limit: int = 48) -> str:
    value = re.sub(r"^(?:今日は|昨日|最近|そういえば)", "", _compact(text)).lstrip("、,")
    value = re.sub(r"(?:だったよ|だよ|なんだ|んだ|でさ|だね|です|ます|よ|ね|さ)$", "", value)
    return value[:limit]


def _option_label(text: str) -> str:
    value = _normalize_clause(text, 32)
    value = re.sub(r"(?:を)?(?:直す|改善する|伸ばす|進める|強化する)$", "", value)
    return value or _normalize_clause(text, 32)
''',
              "normalization",
          )

          old_choice = '''        choice_source = " ".join(value for value in (prior_text, frame.text) if value)
        alternatives: tuple[str, str] | None = None
        for pattern in (
            r"(.{2,28}?)と(.{2,28}?)のどちら",
            r"(.{2,28}?)か[、,]?(.{2,28}?)か(?:で迷|迷って|どっち|どちら)",
        ):
            choice_match = re.search(pattern, _compact(choice_source))
            if choice_match:
                alternatives = (
                    _normalize_clause(choice_match.group(1), 28),
                    _normalize_clause(choice_match.group(2), 28),
                )
                break
'''
          new_choice = '''        alternatives: tuple[str, str] | None = None
        for choice_source in (frame.text, prior_text):
            if not choice_source:
                continue
            for pattern in (
                r"(.{2,28}?)と(.{2,28}?)のどちら",
                r"(.{2,28}?)か[、,]?(.{2,28}?)か(?:で迷|迷って|どっち|どちら)",
            ):
                choice_match = re.search(pattern, _compact(choice_source))
                if choice_match:
                    alternatives = (
                        _normalize_clause(choice_match.group(1), 28),
                        _normalize_clause(choice_match.group(2), 28),
                    )
                    break
            if alternatives:
                break
'''
          text = replace_one(text, old_choice, new_choice, "choice-source")

          text = replace_one(
              text,
              '        context_summary = summary\n        prior_text = ""\n',
              '        context_summary = summary\n        event_summary = summary\n        if frame.timing:\n            event_summary = summary.replace(frame.timing, "", 1).lstrip("に、,")\n        prior_text = ""\n',
              "event-summary",
          )
          replacements = {
              'f"{summary}んだね。{feared_outcome}ことと、{chosen_action}ことのどちらが今は重い？"':
                  'f"『{summary}』という状況なんだね。{feared_outcome}ことと、{chosen_action}ことのどちらが今は重い？"',
              'f"{summary}んだね。{actor_focus}で気力まで削られた感じかな。体の疲れと気持ちの疲れ、今はどちらが大きい？"':
                  'f"『{summary}』という状況なんだね。{actor_focus}で気力まで削られた感じかな。体の疲れと気持ちの疲れ、今はどちらが大きい？"',
              'f"{frame.timing}に{summary}のは対応しづらいね。予定が崩れたことと、相手に断りにくかったことのどちらが大きかった？"':
                  'f"{frame.timing}に{event_summary}のは対応しづらいね。予定が崩れたことと、相手に断りにくかったことのどちらが大きかった？"',
              'f"{context_summary}んだね。そこでは『何が起きたか』より『何が予想と違ったか』が気になる。いちばん意外だったのはどこ？"':
                  'f"『{context_summary}』ということなんだね。そこでは『何が起きたか』より『何が予想と違ったか』が気になる。いちばん意外だったのはどこ？"',
              'f"{feared_outcome}のが気になって、{chosen_action}んだね。"\n                    "断るか引き受けるかの二択に追い込まれたこと自体が負担だったように見える。"':
                  'f"『{feared_outcome}そう』と考えて、{chosen_action}んだね。"\n                    "断るか引き受けるかの二択に追い込まれたこと自体が負担だったように見える。"',
              'f"次は『{conflict_choice}か{chosen_action}か』の二択にしないのがよさそう。"\n                    "今抱えている予定と追加依頼を並べて、どちらを優先するか相手に決めてもらえば、"\n                    f"{feared_outcome}リスクを抑えながら全部を背負わずに済む。"':
                  '"次は『断るか、そのまま引き受けるか』の二択にしないのがよさそう。"\n                    "今抱えている予定と追加依頼を並べて、どちらを優先するか相手に決めてもらえば、"\n                    f"『{feared_outcome}そう』という懸念を抑えながら全部を背負わずに済む。"',
          }
          for old, new in replacements.items():
              text = replace_one(text, old, new, old[:40])

          old_dimensions = '''            if dimensions:
                left, right = dimensions[0], dimensions[1]
                candidates.append(Candidate(
                    f"{context_summary}。{topic or 'その件'}では、{left}と{right}を分けて考えると原因が見えやすい。今の感覚ではどちらが近い？",
                    "topic-dimensions",
                ))
'''
          new_dimensions = '''            if topic in {"ランニング", "マラソン"} and frame.question_type in {"question", "opinion"} and "息" in context_summary and "脚" in context_summary:
                candidates.append(Candidate(
                    "息は保てているのに脚だけ動かなくなるなら、心肺より脚の局所疲労か、前半のペースが速すぎる可能性が高そう。"
                    "まず前半を少し落とし、脚が重くなり始める距離が後ろへずれるか比べると切り分けやすい。",
                    "causal-hypothesis",
                ))
            if dimensions:
                left, right = dimensions[0], dimensions[1]
                candidates.append(Candidate(
                    f"{context_summary}。{topic or 'その件'}では、{left}と{right}を分けて考えると原因が見えやすい。今の感覚ではどちらが近い？",
                    "topic-dimensions",
                ))
'''
          text = replace_one(text, old_dimensions, new_dimensions, "causal-hypothesis")

          old_ordered = '''                candidates.append(Candidate(
                    f"今の情報なら、まず{foundation}を優先する。{enhancement}を伸ばしても、"
                    f"{foundation}が弱いと良さを受け取ってもらえないから。{foundation}の最低基準を通した後に、"
                    f"{enhancement}を伸ばす順番がいいと思う。",
                    "ordered-choice",
                ))
'''
          new_ordered = '''                foundation_label = _option_label(foundation)
                enhancement_label = _option_label(enhancement)
                candidates.append(Candidate(
                    f"今の情報なら、まず『{foundation}』を優先する。『{enhancement}』を進めても、"
                    f"{foundation_label}が弱いと良さを受け取ってもらえないから。{foundation_label}の最低基準を通した後に、"
                    f"{enhancement_label}を伸ばす順番がいいと思う。",
                    "ordered-choice",
                ))
'''
          text = replace_one(text, old_ordered, new_ordered, "choice-language")
          text = replace_one(
              text,
              '            "commitment-experiment": 2.5,\n',
              '            "commitment-experiment": 5.0,\n            "causal-hypothesis": 4.0,\n',
              "strategy-bonus",
          )
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile sparc_hs16/sparc_hs16/dialogue_planner.py
          git diff --check
      - name: Commit quality fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sparc_hs16/sparc_hs16/dialogue_planner.py
          git commit -m "fix: HS21の日本語生成と原因仮説を改善"
          git push origin HEAD:research/sparc-hs16-university-gate
