name: minimal-predictive-lm-phase16c

on:
  pull_request:
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/generic_proposition_machine.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/corrected_proposition_machine.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/signed_claim_graph.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase16c_*.py"
      - "minimal-predictive-lm/tests/test_phase16b_generic_proposition_machine.py"
      - ".github/workflows/minimal-predictive-lm-phase16c.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase16c:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Shared proposition runtime tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p minimal-predictive-lm/results
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase16b_generic_proposition_machine.py' -v 2>&1 | tee minimal-predictive-lm/results/phase16c-test.log
      - name: Run shared proposition public experiment
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.phase16c_experiment
      - name: Upload Phase 16c diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase16c-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            minimal-predictive-lm/results/phase16c-test.log
            minimal-predictive-lm/results/phase16c.json
            minimal-predictive-lm/results/phase16c.md
