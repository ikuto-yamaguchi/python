name: R0 canonical split identity tests

on:
  pull_request:
    paths:
      - 'research/intelligence_swarm/benchmarks/grounded_causal/audit_canonical_split_identity.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/test_audit_canonical_split_identity.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py'
      - '.github/workflows/r0_canonical_split_identity_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile auditor and regression
        run: |
          python -m py_compile \
            research/intelligence_swarm/benchmarks/grounded_causal/audit_canonical_split_identity.py \
            research/intelligence_swarm/benchmarks/grounded_causal/test_audit_canonical_split_identity.py
      - name: Run focused fail-closed regression
        working-directory: research/intelligence_swarm/benchmarks/grounded_causal
        run: python -m unittest -v test_audit_canonical_split_identity.py
