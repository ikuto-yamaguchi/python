name: minimal-predictive-lm-phase18d4
on:
  pull_request:
    paths:
      - 'minimal-predictive-lm/data/phase18d4_self_supervised_sequences.json'
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase18d1_dataset_to_program_meta_learner.py'
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase18d3_latent_task_partition.py'
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase18d4_self_supervised_sequence_learning.py'
      - 'minimal-predictive-lm/tests/test_phase18d4_self_supervised_sequence_learning.py'
      - 'minimal-predictive-lm/docs/phase18d4_self_supervised_sequence_learning.md'
      - '.github/workflows/minimal-predictive-lm-phase18d4.yml'
concurrency:
  group: phase18d4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase18d4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Self-supervised sequence theorem tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_phase18d4_self_supervised_sequence_learning.py
      - name: Run Phase 18d-4 experiment
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.phase18d4_self_supervised_sequence_learning
      - name: Upload Phase 18d-4 diagnostics and results
        uses: actions/upload-artifact@v4
        with:
          name: phase18d4-results
          path: |
            minimal-predictive-lm/results/phase18d4.json
            minimal-predictive-lm/results/phase18d4.md
          retention-days: 7
