name: sparc-hs2-reasoning

on:
  pull_request:
    branches: [research/minimal-compute-lm]
  workflow_dispatch:

jobs:
  hs2-reasoning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit tests
        run: |
          python -m pytest -q \
            minimal-predictive-lm/tests/test_sparc_reasoning.py \
            minimal-predictive-lm/tests/test_sparc_hs2.py
      - name: Train and evaluate SPARC-HS2
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.sparc_hs2_experiment
      - name: Upload model and report
        uses: actions/upload-artifact@v4
        with:
          name: sparc-hs2-reasoning-results
          path: minimal-predictive-lm/results
          retention-days: 14
      - name: Enforce capability and resource gates
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results/sparc_hs2_relational.json').read_text())
          large = result['large_relational_cortex']
          assert result['passed'] is True
          assert result['passed_checks'] == result['total_checks']
          assert result['transformer_used'] is False
          assert result['softmax_attention_used'] is False
          assert result['growing_kv_cache_used'] is False
          assert result['interactive_chat'] is True
          assert large['entities'] == 100000
          assert large['relation_edges'] == 80000
          assert large['correct_queries'] == large['sample_queries'] == 512
          assert large['max_nodes_activated_observed'] <= 8
          assert large['max_edges_inspected_observed'] <= 8
          assert large['dense_global_graph_scan_used'] is False
          assert large['serialized_bytes'] <= 20000000
          assert result['peak_process_kib'] <= 2000000
          PY
