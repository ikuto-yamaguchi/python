name: R0.1 SILG RTFM probe
run-name: R0.1 SILG RTFM 131072-frame reproduction @ ${{ github.sha }}

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - '.github/workflows/r0_silg_rtfm_probe.yml'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/R01_RUN_REQUEST.json'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/silg_rtfm_probe.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/run_silg_recurrent_smoke.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/run_silg_matched_eval.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/export_silg_typed_policy_trajectories.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/export_rtfm_generator_signatures.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/test_export_rtfm_generator_signatures.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/gaddy_klein_typed_baseline.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/r02_typed_comparison.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/audit_r02_holdout_assignments.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/install_silg_rtfm.sh'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/SILG_RTFM_REPRO_001.md'
  workflow_dispatch:

# A 131072-frame three-seed CPU run can exceed one hour. Keep an active run alive
# when later canonical-branch commits arrive; otherwise recurrent automation can
# repeatedly cancel the only experiment that matters before it emits artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  rtfm-public-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip

      - name: Record host and immutable run provenance
        run: |
          mkdir -p research/intelligence_swarm/benchmarks/grounded_causal/results
          {
            echo "github_repository=${GITHUB_REPOSITORY}"
            echo "github_workflow=${GITHUB_WORKFLOW}"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "github_event_name=${GITHUB_EVENT_NAME}"
            echo "github_ref=${GITHUB_REF}"
            echo "github_sha=${GITHUB_SHA}"
            git rev-parse HEAD
            git status --short
            date -u
            uname -a
            lscpu
            free -h
            python --version
          } | tee research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_HOST.txt

      - name: Install pinned public sources
        run: |
          set -o pipefail
          /usr/bin/time -v bash research/intelligence_swarm/benchmarks/grounded_causal/install_silg_rtfm.sh "$RUNNER_TEMP/r0_silg" \
            2>&1 | tee research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_INSTALL.log

      - name: Test generator-signature extraction
        run: |
          python research/intelligence_swarm/benchmarks/grounded_causal/test_export_rtfm_generator_signatures.py

      - name: Run canonical-seed random control and schema probe
        run: |
          set -o pipefail
          /usr/bin/time -v python research/intelligence_swarm/benchmarks/grounded_causal/silg_rtfm_probe.py \
            --env silg:rtfm_train_s1-v0 \
            --seeds 1 7 19 \
            --episodes 20 \
            --max-steps 80 \
            --output research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_RANDOM_CANONICAL_3SEED.json \
            2>&1 | tee research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_RANDOM_CANONICAL.log

      - name: Run official multi recurrent 131072-frame staged training and persist checkpoints
        run: |
          set -o pipefail
          /usr/bin/time -v python research/intelligence_swarm/benchmarks/grounded_causal/run_silg_recurrent_smoke.py \
            --silg-root "$RUNNER_TEMP/r0_silg/silg" \
            --seeds 1 7 19 \
            --frames 131072 \
            --output research/intelligence_swarm/benchmarks/grounded_causal/results \
            2>&1 | tee research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_RECURRENT_SMOKE.log

      - name: Evaluate recurrent and matched random/language-blind/state-only/language-shuffle controls
        run: |
          set -o pipefail
          /usr/bin/time -v python research/intelligence_swarm/benchmarks/grounded_causal/run_silg_matched_eval.py \
            --silg-root "$RUNNER_TEMP/r0_silg/silg" \
            --results research/intelligence_swarm/benchmarks/grounded_causal/results \
            --seeds 1 7 19 \
            --episodes 20 \
            2>&1 | tee research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_MATCHED_EVAL.log

      - name: Export typed SILG trajectories and run matched R0.2 baselines
        run: |
          set -euo pipefail
          results="research/intelligence_swarm/benchmarks/grounded_causal/results"
          : > "$results/SILG_RTFM_R02_TYPED.log"
          : > "$results/SILG_RTFM_TYPED_TRAJECTORIES_3SEED.jsonl"
          : > "$results/SILG_RTFM_GENERATOR_SIGNATURES_3SEED.jsonl"
          for seed in 1 7 19; do
            data="$results/SILG_RTFM_TYPED_TRAJECTORIES_SEED_${seed}.jsonl"
            signatures="$results/SILG_RTFM_GENERATOR_SIGNATURES_SEED_${seed}.jsonl"
            out="$results/SILG_RTFM_R02_TYPED_COMPARISON_SEED_${seed}.json"
            /usr/bin/time -v python research/intelligence_swarm/benchmarks/grounded_causal/export_rtfm_generator_signatures.py \
              --silg-root "$RUNNER_TEMP/r0_silg/silg" \
              --seed "$seed" \
              --train-episodes 40 \
              --test-episodes 20 \
              --out "$signatures" \
              2>&1 | tee -a "$results/SILG_RTFM_R02_TYPED.log"
            cat "$signatures" >> "$results/SILG_RTFM_GENERATOR_SIGNATURES_3SEED.jsonl"
            /usr/bin/time -v python research/intelligence_swarm/benchmarks/grounded_causal/export_silg_typed_policy_trajectories.py \
              --silg-root "$RUNNER_TEMP/r0_silg/silg" \
              --checkpoint "$results/SILG_RTFM_TRAINED_STATE_SEED_${seed}.pt" \
              --seed "$seed" \
              --train-episodes 40 \
              --test-episodes 20 \
              --out "$data" \
              2>&1 | tee -a "$results/SILG_RTFM_R02_TYPED.log"
            cat "$data" >> "$results/SILG_RTFM_TYPED_TRAJECTORIES_3SEED.jsonl"
            /usr/bin/time -v python research/intelligence_swarm/benchmarks/grounded_causal/r02_typed_comparison.py \
              --data "$data" \
              --out "$out" \
              --seed "$seed" \
              --env-epochs 8 \
              --lang-epochs 8 \
              2>&1 | tee -a "$results/SILG_RTFM_R02_TYPED.log"
          done

      - name: Audit real entity, dynamics and language-form holdouts
        if: always()
        run: |
          set -o pipefail
          results="research/intelligence_swarm/benchmarks/grounded_causal/results"
          python research/intelligence_swarm/benchmarks/grounded_causal/audit_r02_holdout_assignments.py \
            "$results/SILG_RTFM_TYPED_TRAJECTORIES_3SEED.jsonl" \
            --output "$results/SILG_RTFM_R02_HOLDOUT_AUDIT.json" \
            2>&1 | tee "$results/SILG_RTFM_R02_HOLDOUT_AUDIT.log" || true

      - name: Freeze installed versions
        if: always()
        run: |
          python -m pip freeze | sort > research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_PIP_FREEZE.txt
          sha256sum \
            research/intelligence_swarm/benchmarks/grounded_causal/results/* \
            > research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_SHA256SUMS.txt || true

      - name: Upload reproducibility bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0-silg-rtfm-probe-${{ github.run_id }}
          path: research/intelligence_swarm/benchmarks/grounded_causal/results/
          if-no-files-found: error
          retention-days: 30
