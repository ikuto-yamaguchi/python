name: R0.1 SILG RTFM probe

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - '.github/workflows/r0_silg_rtfm_probe.yml'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/silg_rtfm_probe.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/run_silg_recurrent_smoke.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/run_silg_matched_eval.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/export_silg_policy_trajectories.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/environment_first_baseline.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/audit_r02_trajectory_eligibility.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/install_silg_rtfm.sh'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/SILG_RTFM_REPRO_001.md'
  pull_request:
    paths:
      - '.github/workflows/r0_silg_rtfm_probe.yml'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/silg_rtfm_probe.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/run_silg_recurrent_smoke.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/run_silg_matched_eval.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/export_silg_policy_trajectories.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/environment_first_baseline.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/audit_r02_trajectory_eligibility.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/install_silg_rtfm.sh'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/SILG_RTFM_REPRO_001.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rtfm-public-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip

      - name: Record host
        run: |
          mkdir -p research/intelligence_swarm/benchmarks/grounded_causal/results
          {
            date -u
            uname -a
            lscpu
            free -h
            python --version
          } | tee research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_HOST.txt

      - name: Install pinned public sources
        run: |
          set -o pipefail
          /usr/bin/time -v bash research/intelligence_swarm/benchmarks/grounded_causal/install_silg_rtfm.sh "$RUNNER_TEMP/r0_silg" \
            2>&1 | tee research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_INSTALL.log

      - name: Run canonical-seed random control and schema probe
        run: |
          set -o pipefail
          /usr/bin/time -v python research/intelligence_swarm/benchmarks/grounded_causal/silg_rtfm_probe.py \
            --env silg:rtfm_train_s1-v0 \
            --seeds 1 7 19 \
            --episodes 20 \
            --max-steps 80 \
            --output research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_RANDOM_CANONICAL_3SEED.json \
            2>&1 | tee research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_RANDOM_CANONICAL.log

      - name: Run official multi recurrent 131072-frame staged training and persist checkpoints
        run: |
          set -o pipefail
          /usr/bin/time -v python research/intelligence_swarm/benchmarks/grounded_causal/run_silg_recurrent_smoke.py \
            --silg-root "$RUNNER_TEMP/r0_silg/silg" \
            --seeds 1 7 19 \
            --frames 131072 \
            --output research/intelligence_swarm/benchmarks/grounded_causal/results \
            2>&1 | tee research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_RECURRENT_SMOKE.log

      - name: Evaluate recurrent and matched random/language-blind/state-only/language-shuffle controls
        run: |
          set -o pipefail
          /usr/bin/time -v python research/intelligence_swarm/benchmarks/grounded_causal/run_silg_matched_eval.py \
            --silg-root "$RUNNER_TEMP/r0_silg/silg" \
            --results research/intelligence_swarm/benchmarks/grounded_causal/results \
            --seeds 1 7 19 \
            --episodes 20 \
            2>&1 | tee research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_MATCHED_EVAL.log

      - name: Export public recurrent-policy trajectories and run R0.2 baselines
        run: |
          set -euo pipefail
          : > research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_R02.log
          for seed in 1 7 19; do
            data="research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_POLICY_TRAJECTORIES_SEED_${seed}.jsonl"
            out="research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_ENVIRONMENT_FIRST_SEED_${seed}.json"
            /usr/bin/time -v python research/intelligence_swarm/benchmarks/grounded_causal/export_silg_policy_trajectories.py \
              --silg-root "$RUNNER_TEMP/r0_silg/silg" \
              --checkpoint "research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_TRAINED_STATE_SEED_${seed}.pt" \
              --seed "$seed" \
              --train-episodes 40 \
              --test-episodes 20 \
              --out "$data" \
              2>&1 | tee -a research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_R02.log
            /usr/bin/time -v python research/intelligence_swarm/benchmarks/grounded_causal/environment_first_baseline.py \
              --data "$data" \
              --out "$out" \
              --seed "$seed" \
              --env-epochs 8 \
              --lang-epochs 8 \
              2>&1 | tee -a research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_R02.log
          done

      - name: Audit R0.2 trajectory eligibility
        if: always()
        run: |
          set -o pipefail
          python research/intelligence_swarm/benchmarks/grounded_causal/audit_r02_trajectory_eligibility.py \
            research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_POLICY_TRAJECTORIES_SEED_1.jsonl \
            research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_POLICY_TRAJECTORIES_SEED_7.jsonl \
            research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_POLICY_TRAJECTORIES_SEED_19.jsonl \
            --output research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_R02_TRAJECTORY_ELIGIBILITY.json \
            2>&1 | tee research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_R02_TRAJECTORY_ELIGIBILITY.log || true

      - name: Freeze installed versions
        if: always()
        run: |
          python -m pip freeze | sort > research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_PIP_FREEZE.txt
          sha256sum \
            research/intelligence_swarm/benchmarks/grounded_causal/results/* \
            > research/intelligence_swarm/benchmarks/grounded_causal/results/SILG_RTFM_SHA256SUMS.txt || true

      - name: Upload reproducibility bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0-silg-rtfm-probe-${{ github.run_id }}
          path: research/intelligence_swarm/benchmarks/grounded_causal/results/
          if-no-files-found: error
          retention-days: 30
