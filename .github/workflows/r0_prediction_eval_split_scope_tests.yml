name: R0 prediction evaluation split scope tests

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - research/intelligence_swarm/benchmarks/grounded_causal/audit_prediction_eval_split_scope.py
      - research/intelligence_swarm/benchmarks/grounded_causal/test_audit_prediction_eval_split_scope.py
      - .github/workflows/r0_prediction_eval_split_scope_tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile auditor
        run: python -m py_compile research/intelligence_swarm/benchmarks/grounded_causal/audit_prediction_eval_split_scope.py
      - name: Run regression tests
        working-directory: research/intelligence_swarm/benchmarks/grounded_causal
        run: python -m unittest -v test_audit_prediction_eval_split_scope.py
