name: R0D Cycle 069 core domain split coverage

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - research/intelligence_swarm/governance/apply_r0d_cycle_069_core_domain_split_coverage.py
      - research/intelligence_swarm/governance/test_evaluation_contract_domain_split_coverage_core.py
      - .github/workflows/r0d_cycle_069_core_domain_split_coverage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/intelligence-swarm-reconstruction-001
          fetch-depth: 0
      - name: Apply domain-local split coverage hardening
        run: python research/intelligence_swarm/governance/apply_r0d_cycle_069_core_domain_split_coverage.py
      - name: Compile
        run: python -m py_compile research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py research/intelligence_swarm/governance/test_evaluation_contract_domain_split_coverage_core.py
      - name: Run focused regression
        run: python research/intelligence_swarm/governance/test_evaluation_contract_domain_split_coverage_core.py
      - name: Save cycle report
        run: |
          cat > research/intelligence_swarm/governance/REPORT_R0D_CYCLE_069.md <<'EOF'
          # R0-D Cycle 069 — domain-local train/evaluation coverage

          `validate_dataset()` now requires every observed domain, for every canonical seed 1/7/19, to contain both a train split and at least one registered evaluation split. A dataset can no longer pass merely because one domain supplies all training rows while another supplies all evaluation rows.

          The audit artifact records `domain_local_train_eval_coverage_required=true` and the per-domain/per-seed split coverage. Missing domain-local train or evaluation evidence is classified as `initial_reproduction_failure`. No memory, replay, fast-weights, sleep, or forgetting mechanism was added.
          EOF
      - name: Commit to canonical branch
        run: |
          if git diff --quiet; then
            echo "No core changes required"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py research/intelligence_swarm/governance/REPORT_R0D_CYCLE_069.md
          git commit -m "r0d: require domain-local train and evaluation coverage"
          git push origin HEAD:research/intelligence-swarm-reconstruction-001
