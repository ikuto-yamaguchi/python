name: R0D Cycle 068 core invalid prediction statistics

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - research/intelligence_swarm/benchmarks/grounded_causal/apply_r0d_cycle_068_core_invalid_prediction_statistics.py
      - research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_invalid_prediction_statistics_core.py
      - .github/workflows/r0d_cycle_068_core_invalid_prediction_statistics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/intelligence-swarm-reconstruction-001
          fetch-depth: 0
      - name: Apply fail-closed score suppression
        working-directory: research/intelligence_swarm/benchmarks/grounded_causal
        run: python apply_r0d_cycle_068_core_invalid_prediction_statistics.py
      - name: Compile
        run: python -m py_compile research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_invalid_prediction_statistics_core.py
      - name: Run focused regressions
        working-directory: research/intelligence_swarm/benchmarks/grounded_causal
        run: |
          python -m unittest -v test_evaluation_contract_invalid_prediction_statistics_core.py
          python -m unittest -v test_evaluation_contract_score_dataset_binding_core.py
      - name: Save cycle report
        run: |
          cat > research/intelligence_swarm/governance/REPORT_R0D_CYCLE_068.md <<'EOF'
          # R0-D Cycle 068 — fail-closed invalid prediction statistics

          `evaluation_contract.score()` now emits `cells`, `summary`, and `paired_gaps_vs_correct` only when the entire dataset and prediction contract is valid. Prediction coverage failures, forbidden gold/outcome fields, snapshot mismatches, invalid actions, optional-metric coverage failures, and invalid shuffle provenance therefore cannot leave quotable statistical evidence behind.

          The score artifact records `invalid_score_statistics_forbidden=true` and `statistics_emitted=false` on failure. Classification remains `initial_reproduction_failure`. No memory, replay, fast-weights, sleep, or forgetting mechanism was added.
          EOF
      - name: Commit to canonical branch
        run: |
          if git diff --quiet; then
            echo "No core changes required"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py research/intelligence_swarm/governance/REPORT_R0D_CYCLE_068.md
          git commit -m "r0d: suppress statistics for invalid prediction contracts"
          git push origin HEAD:research/intelligence-swarm-reconstruction-001
