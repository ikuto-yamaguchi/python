name: minimal-predictive-lm-cap-gen-002-rii-003

on:
  pull_request:
    branches:
      - research/minimal-compute-lm
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/cap_gen_002_factorized_context_induction.py"
      - "minimal-predictive-lm/tests/test_cap_gen_002_factorized_context_induction.py"
      - "minimal-predictive-lm/docs/cap_gen_002_factorized_context_induction.md"
      - ".github/workflows/minimal-predictive-lm-cap-gen-002-rii-003.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  factorized-context-induction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Contract and falsification tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_cap_gen_002_factorized_context_induction.py
      - name: Run frozen factorized-context experiment
        working-directory: minimal-predictive-lm
        run: |
          mkdir -p results
          python -m minimal_predictive_lm.cap_gen_002_factorized_context_induction \
            | tee results/cap_gen_002_rii_003.json
      - name: Enforce measured and claim boundaries
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("results/cap_gen_002_rii_003.json").read_text())
          assert result["passed"] is True
          assert result["training_boundary_recovery"]["precision"] == 1.0
          assert result["training_boundary_recovery"]["recall"] == 1.0
          assert result["frozen_unseen_combination_evaluation"]["precision"] == 1.0
          assert result["frozen_unseen_combination_evaluation"]["recall"] == 1.0
          assert result["frozen_unseen_combination_evaluation"]["exact_accuracy"] == 1.0
          assert result["exact_pair_baseline"]["paired_predictions"] == 0
          assert result["rii_002_exact_anchor_baseline"]["surface_links"] == 0
          assert result["independent_target_control"]["context_roles"] == 0
          assert result["model"]["learned_payload_bits"] < result["model"]["exact_cross_product_template_bits"]
          assert "already observed individual context variants" in result["claim_boundary"]

          boundary = Path("docs/cap_gen_002_factorized_context_induction.md").read_text()
          assert "Theta(k^2)" in boundary
          assert "Theta(k)" in boundary
          assert "Do not increase the number of anchor variants" in boundary
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: cap-gen-002-rii-003-results
          path: minimal-predictive-lm/results/cap_gen_002_rii_003.json
          retention-days: 14
