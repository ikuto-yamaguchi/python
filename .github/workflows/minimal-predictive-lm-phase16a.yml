name: minimal-predictive-lm-phase16a

on:
  pull_request:
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase16a_*.py"
      - "minimal-predictive-lm/tests/test_phase16a_*.py"
      - "minimal-predictive-lm/pyproject.toml"
      - ".github/workflows/minimal-predictive-lm-phase16a.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase16a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Frozen third-slice regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p minimal-predictive-lm/results
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase16a_frozen_third_slice.py' -v 2>&1 | tee minimal-predictive-lm/results/phase16a-test.log
      - name: Run frozen public Phase 16a experiment
        working-directory: minimal-predictive-lm
        run: mpm-phase16a
      - name: Capture non-abstention diagnostics
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.phase16a_diagnostic
      - name: Upload Phase 16a diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase16a-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            minimal-predictive-lm/results/phase16a-test.log
            minimal-predictive-lm/results/phase16a.json
            minimal-predictive-lm/results/phase16a.md
            minimal-predictive-lm/results/phase16a_diagnostic.json
