name: R0D Cycle 064 core normalized holdout identity

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - research/intelligence_swarm/benchmarks/grounded_causal/apply_r0d_cycle_064_core_normalized_holdout_identity.py
      - research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_normalized_holdout_identity_core.py
      - .github/workflows/r0d_cycle_064_core_normalized_holdout_identity.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r0d-cycle-064-core-normalized-holdout-identity
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/intelligence-swarm-reconstruction-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply fail-closed core patch
        run: python research/intelligence_swarm/benchmarks/grounded_causal/apply_r0d_cycle_064_core_normalized_holdout_identity.py
      - name: Compile core and regression
        run: |
          python -m py_compile \
            research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py \
            research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_normalized_holdout_identity_core.py
      - name: Run focused regression
        run: python research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_normalized_holdout_identity_core.py
      - name: Write cycle report
        run: |
          cat > research/intelligence_swarm/governance/REPORT_R0D_CYCLE_064.md <<'EOF'
          # R0-D Cycle 064 — normalized holdout identity in the core contract

          `evaluation_contract.py` now canonicalizes entity and dynamics split identities before hashing.

          Fail-closed normalization covers recursive mappings/sequences, Unicode NFKC, case folding,
          whitespace/control/format removal, and numeric-vs-string scalar aliases. Therefore width,
          case, invisible characters, or JSON scalar representation cannot make a train identity appear held out.

          Focused regressions cover full-width/case aliases, invisible-space aliases, numeric/string aliases,
          structured dynamics aliases, a rejected explicit holdout reuse, and a genuinely distinct holdout.

          No memory, replay, fast weights, sleep, or forgetting mechanism was added. No public baseline or
          real R0 bundle is accepted by this change. Unmet reproduction evidence remains classified as
          `initial_reproduction_failure`.
          EOF
      - name: Commit to the same canonical branch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py \
            research/intelligence_swarm/governance/REPORT_R0D_CYCLE_064.md
          git commit -m 'research: integrate normalized holdout identity into R0 core'
          git push origin HEAD:research/intelligence-swarm-reconstruction-001
