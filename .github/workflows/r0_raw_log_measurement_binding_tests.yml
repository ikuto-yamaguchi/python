name: R0 raw log measurement binding tests

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - research/intelligence_swarm/benchmarks/grounded_causal/audit_raw_log_measurement_binding.py
      - research/intelligence_swarm/benchmarks/grounded_causal/test_audit_raw_log_measurement_binding.py
      - .github/workflows/r0_raw_log_measurement_binding_tests.yml
  pull_request:
    paths:
      - research/intelligence_swarm/benchmarks/grounded_causal/audit_raw_log_measurement_binding.py
      - research/intelligence_swarm/benchmarks/grounded_causal/test_audit_raw_log_measurement_binding.py
      - .github/workflows/r0_raw_log_measurement_binding_tests.yml

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile auditor
        run: python -m py_compile research/intelligence_swarm/benchmarks/grounded_causal/audit_raw_log_measurement_binding.py
      - name: Run focused regressions
        run: python research/intelligence_swarm/benchmarks/grounded_causal/test_audit_raw_log_measurement_binding.py
