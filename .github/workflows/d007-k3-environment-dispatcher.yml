name: D007 K3 environment dispatcher
on:
  workflow_dispatch:
    inputs:
      canonical_commit_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  environment-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.canonical_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: false
      - name: Run preregistered environment-only probe
        env:
          OUT: ${{ runner.temp }}/d007-artifact
        run: bash benchmarks/k3_minimal/preflight/d003_gha_environment.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d007-k3-environment
          path: ${{ runner.temp }}/d007-artifact
          if-no-files-found: error
