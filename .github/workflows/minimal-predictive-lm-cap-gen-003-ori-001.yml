name: minimal-predictive-lm-cap-gen-003-ori-001

on:
  pull_request:
    branches:
      - research/minimal-compute-lm
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/cap_gen_003_opaque_role_core.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/cap_gen_003_opaque_role_stream.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/cap_gen_003_opaque_roles.py"
      - "minimal-predictive-lm/tests/test_cap_gen_003_opaque_roles*.py"
      - "minimal-predictive-lm/tests/test_ori_*.py"
      - "minimal-predictive-lm/docs/cap_gen_003_opaque_role_induction.md"
      - ".github/workflows/minimal-predictive-lm-cap-gen-003-ori-001.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  opaque-role-induction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Theory proposition tests
        run: |
          python -m pytest -q \
            minimal-predictive-lm/tests/test_cap_gen_003_opaque_roles_core.py \
            minimal-predictive-lm/tests/test_ori_ambiguity.py \
            minimal-predictive-lm/tests/test_ori_accounting.py \
            minimal-predictive-lm/tests/test_ori_resource_vector.py \
            minimal-predictive-lm/tests/test_ori_claim.py
      - name: Run frozen ORI gate
        working-directory: minimal-predictive-lm
        run: |
          mkdir -p results
          python -m minimal_predictive_lm.cap_gen_003_opaque_roles \
            | tee results/cap_gen_003_ori_001.json
      - name: Enforce purpose and claim boundaries
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("results/cap_gen_003_ori_001.json").read_text())
          assert result["passed"] is True
          assert result["stream"]["reset_tokens_used"] == 0
          assert result["stream"]["semantic_role_tokens_used"] == 0
          assert result["stream"]["domain_label_tokens_used"] == 0
          assert result["stream"]["all_boundaries_causal"] is True
          assert result["training"]["unique_role_interpretations"] == [1, 1]
          assert result["training"]["surface_copy_baseline_status"] == "contradiction"
          assert result["positive_transfer"]["exact_accuracy"] == 1.0
          assert result["positive_transfer"]["predictions"] == 9
          assert result["positive_transfer"]["grounded_interactions"] == 1
          assert result["positive_transfer"]["future_successors_used"] == 0
          assert result["positive_transfer"]["zero_anchor_status"] == "abstain"
          assert result["positive_transfer"]["unsupported_status"] == "unsupported"
          assert result["nonidentifiable_roles"]["status"] == "abstain"
          assert result["role_absorption"]["core_only_reduction"] == 12.0
          assert result["role_absorption"]["fully_charged_reduction"] == 0.48
          assert result["resources"]["equal_weight_global_surplus"] == -4.0
          assert result["resources"]["incremental_new_context"]["surplus"] == 5
          assert "prior art" in result["claim_boundary"]
          assert "not raw-byte event discovery" in result["claim_boundary"]

          theory = Path("docs/cap_gen_003_opaque_role_induction.md").read_text()
          assert "Role non-identifiability proposition" in theory
          assert "Another finite opaque-tag cycle stream by itself is not research progress" in theory
          assert "public or natural interaction trace" in theory
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: cap-gen-003-ori-001-results
          path: minimal-predictive-lm/results/cap_gen_003_ori_001.json
          retention-days: 14
