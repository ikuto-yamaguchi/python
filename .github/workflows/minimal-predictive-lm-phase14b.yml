name: minimal-predictive-lm-phase14b

on:
  pull_request:
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/provenance_concept_graph.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase14b_*.py"
      - "minimal-predictive-lm/tests/test_phase14b_*.py"
      - "minimal-predictive-lm/pyproject.toml"
      - ".github/workflows/minimal-predictive-lm-phase14b.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase14b:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Provenance graph regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p minimal-predictive-lm/results
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase14b_provenance_concept_graph.py' -v 2>&1 | tee minimal-predictive-lm/results/phase14b-test.log
      - name: Upload Phase 14b diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14b-diagnostics
          retention-days: 7
          path: minimal-predictive-lm/results/phase14b-test.log
      - name: Run provenance overlay public experiment
        working-directory: minimal-predictive-lm
        run: mpm-phase14b
      - name: Upload Phase 14b result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14b-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            minimal-predictive-lm/results/phase14b.json
            minimal-predictive-lm/results/phase14b.md
