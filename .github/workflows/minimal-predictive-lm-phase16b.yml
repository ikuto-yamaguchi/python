name: minimal-predictive-lm-phase16b

on:
  pull_request:
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/aggregate_routing.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase16b_*.py"
      - "minimal-predictive-lm/tests/test_phase16b_*.py"
      - "minimal-predictive-lm/pyproject.toml"
      - ".github/workflows/minimal-predictive-lm-phase16b.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase16b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Aggregate routing regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p minimal-predictive-lm/results
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase16b_aggregate_routing.py' -v 2>&1 | tee minimal-predictive-lm/results/phase16b-test.log
      - name: Run Phase 16b routing calibration experiment
        working-directory: minimal-predictive-lm
        run: mpm-phase16b
      - name: Upload Phase 16b diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase16b-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            minimal-predictive-lm/results/phase16b-test.log
            minimal-predictive-lm/results/phase16b.json
            minimal-predictive-lm/results/phase16b.md
