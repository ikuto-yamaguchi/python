name: R0 prediction payload leakage tests

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - research/intelligence_swarm/benchmarks/grounded_causal/audit_prediction_payload_leakage.py
      - research/intelligence_swarm/benchmarks/grounded_causal/test_audit_prediction_payload_leakage.py
      - .github/workflows/r0_prediction_payload_leakage_tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prediction-payload-leakage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile auditor and tests
        run: |
          python -m py_compile \
            research/intelligence_swarm/benchmarks/grounded_causal/audit_prediction_payload_leakage.py \
            research/intelligence_swarm/benchmarks/grounded_causal/test_audit_prediction_payload_leakage.py
      - name: Run focused regression
        run: |
          python research/intelligence_swarm/benchmarks/grounded_causal/test_audit_prediction_payload_leakage.py
