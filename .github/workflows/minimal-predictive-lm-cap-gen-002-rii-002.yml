name: minimal-predictive-lm-cap-gen-002-rii-002

on:
  pull_request:
    branches:
      - research/minimal-compute-lm
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/cap_gen_002_loop_microprogram_induction.py"
      - "minimal-predictive-lm/tests/test_cap_gen_002_loop_microprogram_induction.py"
      - "minimal-predictive-lm/docs/cap_gen_002_loop_microprogram_induction.md"
      - ".github/workflows/minimal-predictive-lm-cap-gen-002-rii-002.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  loop-microprogram-induction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Contract and falsification tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_cap_gen_002_loop_microprogram_induction.py
      - name: Run frozen loop microprogram experiment
        working-directory: minimal-predictive-lm
        run: |
          mkdir -p results
          python -m minimal_predictive_lm.cap_gen_002_loop_microprogram_induction \
            | tee results/cap_gen_002_rii_002.json
      - name: Enforce measured and claim boundaries
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("results/cap_gen_002_rii_002.json").read_text())
          assert result["passed"] is True
          assert result["boundary_recovery"]["precision"] == 1.0
          assert result["boundary_recovery"]["recall"] == 1.0
          assert result["model"]["surface_links"] == 6
          assert result["model"]["shared_programs"] == 3
          assert result["frozen_evaluation"]["exact_accuracy"] == 1.0
          assert result["rii_001_affine_baseline"]["surface_links"] == 4
          assert result["independent_target_control"]["accepted_links"] == 0
          assert "not a universal" in result["claim_boundary"]

          boundary = Path("docs/cap_gen_002_loop_microprogram_induction.md").read_text()
          assert "transformation-specific opcodes" in boundary
          assert "is prohibited" in boundary
          assert "does not establish natural-language understanding" in boundary
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: cap-gen-002-rii-002-results
          path: minimal-predictive-lm/results/cap_gen_002_rii_002.json
          retention-days: 14
