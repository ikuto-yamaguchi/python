name: minimal-predictive-lm-phase14a

on:
  pull_request:
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/wordnet_ontology.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase14a_*.py"
      - "minimal-predictive-lm/tests/test_phase14a_*.py"
      - "minimal-predictive-lm/pyproject.toml"
      - ".github/workflows/minimal-predictive-lm-phase14a.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase14a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Ontology regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p minimal-predictive-lm/results
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase14a_wordnet_ontology.py' -v 2>&1 | tee minimal-predictive-lm/results/phase14a-test.log
      - name: Upload Phase 14a diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14a-diagnostics
          retention-days: 7
          path: minimal-predictive-lm/results/phase14a-test.log
      - name: Run pinned public ontology experiment
        working-directory: minimal-predictive-lm
        run: mpm-phase14a
      - name: Upload Phase 14a result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14a-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            minimal-predictive-lm/results/phase14a.json
            minimal-predictive-lm/results/phase14a.md
