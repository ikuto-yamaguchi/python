name: minimal-predictive-lm-phase18a5

on:
  pull_request:
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase18a4_*.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase18a5_*.py"
      - "minimal-predictive-lm/tests/test_phase18a5_*.py"
      - "minimal-predictive-lm/docs/phase18a5_*.md"
      - ".github/workflows/minimal-predictive-lm-phase18a5.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase18a5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Conjugation class theorem tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p minimal-predictive-lm/results
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase18a5_conjugation_class_allomorphy.py' -v 2>&1 | tee minimal-predictive-lm/results/phase18a5-test.log
      - name: Run Phase 18a-5 experiment
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.phase18a5_conjugation_class_allomorphy
      - name: Upload Phase 18a-5 diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18a5-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            minimal-predictive-lm/results/phase18a5-test.log
            minimal-predictive-lm/results/phase18a5.json
            minimal-predictive-lm/results/phase18a5.md
