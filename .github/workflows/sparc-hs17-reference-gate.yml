name: sparc-hs17-reference-gate

on:
  pull_request:
    branches: [research/minimal-compute-lm]
  workflow_dispatch:

concurrency:
  group: sparc-hs17-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hs17-reference-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_english_role_compiler.py
      - name: Run integrated and uninspected-tail gates
        id: experiment
        continue-on-error: true
        working-directory: minimal-predictive-lm
        run: |
          set -o pipefail
          python -m minimal_predictive_lm.sparc_hs17_reference_gate 2>&1 | tee ../sparc-hs17-reference-gate.log
      - name: Upload results or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparc-hs17-reference-gate-results
          path: |
            minimal-predictive-lm/results/sparc_hs17_reference_gate.json
            minimal-predictive-lm/results/sparc_hs17_reference_gate.md
            sparc-hs17-reference-gate.log
          retention-days: 14
      - name: Enforce gate
        if: always()
        run: test "${{ steps.experiment.outcome }}" = "success"
