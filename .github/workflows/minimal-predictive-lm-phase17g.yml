name: minimal-predictive-lm-phase17g

on:
  pull_request:
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase17f_*.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase17g_*.py"
      - "minimal-predictive-lm/tests/test_phase17g_*.py"
      - "minimal-predictive-lm/docs/phase17g_*.md"
      - "minimal-predictive-lm/docs/phase18_*.md"
      - ".github/workflows/minimal-predictive-lm-phase17g.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase17g:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Joint role-grounding theorem tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p minimal-predictive-lm/results
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase17g_joint_role_grounding.py' -v 2>&1 | tee minimal-predictive-lm/results/phase17g-test.log
      - name: Run joint role-grounding experiment
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.phase17g_joint_role_grounding
      - name: Upload Phase 17g diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase17g-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            minimal-predictive-lm/results/phase17g-test.log
            minimal-predictive-lm/results/phase17g.json
            minimal-predictive-lm/results/phase17g.md
