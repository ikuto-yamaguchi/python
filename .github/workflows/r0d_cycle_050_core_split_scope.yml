name: R0-D Cycle 050 core split scope

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - research/intelligence_swarm/benchmarks/grounded_causal/apply_r0d_cycle_050_core_split_scope.py
      - .github/workflows/r0d_cycle_050_core_split_scope.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/intelligence-swarm-reconstruction-001
          fetch-depth: 0
      - name: Apply idempotent core patch
        run: python research/intelligence_swarm/benchmarks/grounded_causal/apply_r0d_cycle_050_core_split_scope.py
      - name: Compile and run focused regressions
        run: |
          python -m py_compile research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py
          python -m pytest -q research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_split_scope_core.py
      - name: Commit generated core changes
        run: |
          if git diff --quiet; then
            echo "Core split-scope patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py \
                  research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_split_scope_core.py \
                  research/intelligence_swarm/governance/REPORT_R0D_CYCLE_050.md
          git commit -m "R0-D Cycle 050: enforce registered splits in core contract"
          git push origin HEAD:research/intelligence-swarm-reconstruction-001
