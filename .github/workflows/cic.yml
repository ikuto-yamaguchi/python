name: cic

on:
  pull_request:
    branches: [research/minimal-compute-lm]
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/cic_*.py"
      - "minimal-predictive-lm/tests/test_cic_*.py"
      - "minimal-predictive-lm/docs/cic_*.md"
      - ".github/workflows/cic.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_cic_a.py minimal-predictive-lm/tests/test_cic_b.py
      - name: Acquire public MAWPS Japanese
        run: |
          rm -rf /tmp/cot-ja
          git clone --depth 1 https://github.com/nlp-waseda/chain-of-thought-ja-dataset.git /tmp/cot-ja
          mkdir -p minimal-predictive-lm/public_data/cic
          cp -R /tmp/cot-ja/dataset/mawps minimal-predictive-lm/public_data/cic/mawps_ja
          test -f minimal-predictive-lm/public_data/cic/mawps_ja/test.json
      - name: Run CIC public experiment
        working-directory: minimal-predictive-lm
        run: |
          mkdir -p results
          python -m minimal_predictive_lm.cic_experiment \
            public_data/cic/mawps_ja/test.json \
            --output results/cic_001_mawps.json \
            | tee results/cic_001_stdout.json
      - name: Enforce capability and resource gates
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('results/cic_001_mawps.json').read_text())
          assert result['passed'] is True
          assert result['neural_network_used'] is False
          assert result['gradient_training_used'] is False
          assert result['selection']['test_used_for_selection'] is False
          assert result['full']['accuracy'] >= 0.62
          assert result['compact']['accuracy'] >= 0.58
          assert result['compact']['artifact_bytes'] <= 150000
          assert result['full']['mechanisms'] <= 100
          assert 'not Japanese high-school-level intelligence' in result['claim_boundary']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cic-001-results
          path: |
            minimal-predictive-lm/results/cic_001_mawps.json
            minimal-predictive-lm/results/cic_001_mawps.full.cic
            minimal-predictive-lm/results/cic_001_mawps.compact.cic
          retention-days: 14
