name: cic

on:
  pull_request:
    branches: [research/minimal-compute-lm]
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/cic_*.py"
      - "minimal-predictive-lm/tests/test_cic_*.py"
      - "minimal-predictive-lm/docs/cic_*.md"
      - ".github/workflows/cic.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Acquire public traces
        run: |
          mkdir -p minimal-predictive-lm/public_data/cic
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          root = Path('minimal-predictive-lm/public_data/cic')
          urls = {
              'mgsm_ja.tsv': 'https://raw.githubusercontent.com/google-research/url-nlp/452a21ad3dae5668c06ceeac21ff073e1e40f9be/mgsm/mgsm_ja.tsv',
              'gsm8k_test.jsonl': 'https://raw.githubusercontent.com/WannaLearning/grade-school-math/master/grade_school_math/data/test.jsonl',
              'gsm8k_train.jsonl': 'https://raw.githubusercontent.com/WannaLearning/grade-school-math/master/grade_school_math/data/train.jsonl',
          }
          for name, url in urls.items():
              data = urlopen(url).read()
              if name == 'gsm8k_test.jsonl':
                  data = b'\n'.join(data.splitlines()[:250]) + b'\n'
              (root / name).write_bytes(data)
          PY
          git clone --depth 1 https://github.com/nlp-waseda/chain-of-thought-ja-dataset.git /tmp/cot-ja
          cp -R /tmp/cot-ja/dataset/mawps minimal-predictive-lm/public_data/cic/mawps_ja
      - name: Verify public inputs
        run: |
          test "$(wc -l < minimal-predictive-lm/public_data/cic/mgsm_ja.tsv)" -eq 250
          test "$(wc -l < minimal-predictive-lm/public_data/cic/gsm8k_test.jsonl)" -eq 250
          test "$(wc -l < minimal-predictive-lm/public_data/cic/gsm8k_train.jsonl)" -gt 7000
          test -d minimal-predictive-lm/public_data/cic/mawps_ja
      - uses: actions/upload-artifact@v4
        with:
          name: cic-001-public-inputs
          path: minimal-predictive-lm/public_data/cic
          retention-days: 14
