name: SEM Tiny ABN tests

on:
  pull_request:
    paths:
      - "sem-tiny-abn/**"
      - ".github/workflows/sem-tiny-abn-tests.yml"
  push:
    paths:
      - "sem-tiny-abn/**"
      - ".github/workflows/sem-tiny-abn-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sem-tiny-abn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sem-tiny-abn/requirements-dev.txt
      - name: Install dependencies
        run: pip install -q -r requirements-dev.txt
      - name: Run tests
        run: pytest -vv --tb=short
      - name: Smoke benchmark
        run: python -m sem_tiny_abn.model_summary --model tiny_abn --image-size 128 --iterations 2
