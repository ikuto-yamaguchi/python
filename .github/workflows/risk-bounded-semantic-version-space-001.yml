name: risk-bounded-semantic-version-space-001
on:
  pull_request:
    branches: [research/minimal-compute-lm]
  workflow_dispatch:
jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        working-directory: minimal-predictive-lm
        run: PYTHONPATH=src python -m unittest tests.test_risk_bounded_semantic_version_space
      - name: Experiment
        working-directory: minimal-predictive-lm
        run: PYTHONPATH=src python -S run_risk_bounded_semantic_version_space.py
      - name: Claim boundary
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          report=json.load(open('risk_bounded_semantic_version_space_report.json'))
          assert report['summary']['identifiable_accuracy'] == 1.0
          assert report['summary']['indistinguishable_ambiguity_preserved'] == 1.0
          assert report['summary']['max_unsafe_execution_rate'] == 0.0
          assert report['highschool_level_passed'] is False
          assert report['native_japanese_communication_passed'] is False
          assert report['completion'] is False
          assert not any(report['integrated_gate'].values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: risk-bounded-semantic-version-space-001
          path: minimal-predictive-lm/risk_bounded_semantic_version_space_report.json
