name: sparc-hs18-remaining-gate

on:
  pull_request:
    branches: [research/minimal-compute-lm]
  workflow_dispatch:

concurrency:
  group: sparc-hs18-remaining-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hs18-remaining-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Semantic and curriculum unit tests
        run: |
          mkdir -p minimal-predictive-lm/results
          set -o pipefail
          python -m pytest -vv \
            minimal-predictive-lm/tests/test_sparc_hs18_semantics.py \
            minimal-predictive-lm/tests/test_sparc_hs18_semantics_v2.py \
            minimal-predictive-lm/tests/test_synthetic_causal_curriculum.py \
            --junitxml=minimal-predictive-lm/results/hs18_semantic_junit.xml \
            2>&1 | tee minimal-predictive-lm/results/hs18_semantic_unit.log
      - name: Train procedural causal curriculum and run frozen gates
        working-directory: minimal-predictive-lm
        run: |
          set -o pipefail
          python -m minimal_predictive_lm.sparc_hs18_curriculum_gate 2>&1 | tee ../sparc-hs18-remaining-gate.log
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparc-hs18-remaining-gate-results
          path: |
            minimal-predictive-lm/results/hs18_semantic_junit.xml
            minimal-predictive-lm/results/hs18_semantic_unit.log
            minimal-predictive-lm/results/hs18_curriculum_causal_ranker.zlib
            minimal-predictive-lm/results/hs18_curriculum_causal_training.json
            minimal-predictive-lm/results/sparc_hs18_remaining_gate.json
            minimal-predictive-lm/results/sparc_hs18_remaining_gate.md
            sparc-hs18-remaining-gate.log
          retention-days: 14
      - name: Enforce capability, mobile, curriculum learning, and disclosure boundaries
        if: always()
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('results/sparc_hs18_remaining_gate.json').read_text())
          protocol = row['protocol']
          learned = row['curriculum_causal_ranker']
          assert row['passed'] is True
          assert row['score']['correct'] >= 581
          assert row['axis_scores']['adjective_order']['correct'] >= 36
          assert row['axis_scores']['causal_judgement']['correct'] >= 30
          assert row['final_uninspected_causal']['score']['correct'] >= 28
          assert row['resources']['planned_complete_mobile_package_bytes'] <= 1_000_000_000
          assert protocol['axis_visible_to_worker'] is False
          assert protocol['curriculum_development_train_rows'] == 120
          assert protocol['curriculum_development_validation_rows'] == 22
          assert protocol['curriculum_synthetic_train_rows'] >= 80
          assert protocol['curriculum_synthetic_holdout_rows'] >= 30
          assert protocol['curriculum_tail_targets_used'] == 0
          assert protocol['highest_individual_target_index_inspected'] == 141
          assert protocol['final_individual_target_labels_inspected_before_freeze'] == 0
          assert protocol['aggregate_score_leakage_from_prior_120_159_run'] is True
          assert protocol['strict_unseen_holdout_claim_allowed'] is False
          assert learned['synthetic_holdout_accuracy'] >= 0.80
          assert learned['serialized_bytes'] < 1_000_000
          assert row['checks']['curriculum_tail_targets_excluded'] is True
          assert row['mobile_device_gate_passed'] is False
          assert row['highschool_level_passed'] is False
          PY
