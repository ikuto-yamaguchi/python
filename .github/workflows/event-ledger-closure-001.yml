name: event-ledger-closure-001

on:
  pull_request:
    branches: [research/minimal-compute-lm]
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/event_ledger_closure.py"
      - "minimal-predictive-lm/tests/test_event_ledger_closure.py"
      - ".github/workflows/event-ledger-closure-001.yml"
  workflow_dispatch:

jobs:
  falsify-event-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Unit tests
        run: python -m unittest minimal-predictive-lm/tests/test_event_ledger_closure.py -v
      - name: Run experiment
        run: python -m minimal_predictive_lm.event_ledger_closure --output-dir artifacts/event-ledger-closure-001
      - name: Enforce honest claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/event-ledger-closure-001/event-ledger-closure-001.json').read_text())
          assert report['under_1gb']
          assert report['largest_scale']['candidate_count'] == 1
          assert report['architecture']['stored_complete_answers'] is False
          assert report['highschool_level_passed'] is False
          assert report['native_japanese_communication_passed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-ledger-closure-001-results
          path: artifacts/event-ledger-closure-001
          retention-days: 90
