name: sparc-hs11-cross-domain

on:
  pull_request:
    branches: [research/minimal-compute-lm]
  workflow_dispatch:

jobs:
  hs11-cross-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit tests
        run: >-
          python -m pytest -q
          minimal-predictive-lm/tests/test_sparc_role_induction.py
          minimal-predictive-lm/tests/test_sparc_role_competition.py
          minimal-predictive-lm/tests/test_sparc_cross_domain_plans.py
      - name: Train and evaluate SPARC-HS11
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.sparc_hs11_experiment
      - name: Upload model and report
        uses: actions/upload-artifact@v4
        with:
          name: sparc-hs11-cross-domain-results
          path: minimal-predictive-lm/results
          retention-days: 14
      - name: Enforce capability and resource gates
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results/sparc_hs11_cross_domain.json').read_text())
          scale = result['large_cross_domain_memory']
          assert result['passed'] is True
          assert result['passed_checks'] == result['total_checks'] == 12
          assert result['transformer_used'] is False
          assert result['softmax_attention_used'] is False
          assert result['growing_kv_cache_used'] is False
          assert scale['subjects'] == 50000
          assert scale['episodes'] == 100000
          assert scale['indexed_relation_slots'] == 100000
          assert scale['correct_queries'] == scale['sample_queries'] == 512
          assert scale['max_plan_candidates'] <= 1
          assert scale['max_anchor_reads'] <= 32
          assert scale['max_fact_reads'] <= 2
          assert scale['max_estimated_operations'] <= 64
          assert scale['plans'] == 1
          assert scale['schemas'] == 1
          assert scale['global_subject_scan_used'] is False
          assert scale['global_episode_scan_used'] is False
          assert scale['global_plan_scan_used'] is False
          assert scale['serialized_bytes'] <= 10000000
          assert result['peak_process_kib'] <= 1200000
          assert result['elapsed_seconds'] <= 120
          PY
