name: cic-mixed

on:
  pull_request:
    branches: [research/minimal-compute-lm]
  workflow_dispatch:

jobs:
  mixed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_cic_mixed.py
      - name: Acquire JNLI
        run: |
          mkdir -p minimal-predictive-lm/public_data/cic_mixed
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/yahoojapan/JGLUE/v1.1.0/datasets/jnli-v1.1/train-v1.1.json \
            -o minimal-predictive-lm/public_data/cic_mixed/jnli-train.jsonl
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/yahoojapan/JGLUE/v1.1.0/datasets/jnli-v1.1/valid-v1.1.json \
            -o minimal-predictive-lm/public_data/cic_mixed/jnli-valid.jsonl
      - name: Run JNLI representation diagnostic
        working-directory: minimal-predictive-lm
        run: |
          mkdir -p results
          python -m minimal_predictive_lm.cic_jnli_diagnostic \
            public_data/cic_mixed/jnli-train.jsonl \
            public_data/cic_mixed/jnli-valid.jsonl \
            --output results/cic_007_jnli_diagnostic.json
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: cic-007-jnli-diagnostic-results
          path: minimal-predictive-lm/results
          retention-days: 14
      - name: Enforce diagnostic gate
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('results/cic_007_jnli_diagnostic.json').read_text())
          assert row['passed'] is True
          assert row['official_valid']['accuracy'] > row['majority_accuracy']
          PY
