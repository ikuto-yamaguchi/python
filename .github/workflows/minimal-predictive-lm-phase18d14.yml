name: minimal-predictive-lm-phase18d14

# Isolated verification marker; no runtime behavior change.
on:
  pull_request:
    paths:
      - 'minimal-predictive-lm/data/phase18d14_joint_byte_stream.json'
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase18d14_byte_codec_core.py'
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase18d14_joint_byte_codec.py'
      - 'minimal-predictive-lm/tests/test_phase18d14_joint_byte_codec.py'
      - 'minimal-predictive-lm/docs/phase18d14_joint_byte_codec.md'
      - '.github/workflows/minimal-predictive-lm-phase18d14.yml'

concurrency:
  group: phase18d14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase18d14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Joint byte codec theorem tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q minimal-predictive-lm/tests/test_phase18d14_joint_byte_codec.py 2>&1 | tee phase18d14-pytest.log
      - name: Run Phase 18d-14 experiment
        id: experiment
        continue-on-error: true
        working-directory: minimal-predictive-lm
        run: |
          set -o pipefail
          python -m minimal_predictive_lm.phase18d14_joint_byte_codec 2>&1 | tee ../phase18d14-experiment.log
      - name: Upload Phase 18d-14 diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18d14-results
          path: |
            minimal-predictive-lm/results/phase18d14.json
            minimal-predictive-lm/results/phase18d14.md
            phase18d14-pytest.log
            phase18d14-experiment.log
          retention-days: 7
      - name: Enforce Phase 18d-14 success
        if: always()
        run: |
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.experiment.outcome }}" = "success"
