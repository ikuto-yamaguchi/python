name: minimal-predictive-lm-femi-002-mgsm

on:
  pull_request:
    branches:
      - research/minimal-compute-lm
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/femi_mgsm.py"
      - "minimal-predictive-lm/tests/test_femi_mgsm.py"
      - "minimal-predictive-lm/docs/femi_002_mgsm.md"
      - ".github/workflows/minimal-predictive-lm-femi-002-mgsm.yml"
  workflow_dispatch:

jobs:
  femi-mgsm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_femi_mgsm.py
      - name: Download public MGSM sources
        run: |
          mkdir -p minimal-predictive-lm/public_data/mgsm
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen

          base = "https://raw.githubusercontent.com/google-research/url-nlp/452a21ad3dae5668c06ceeac21ff073e1e40f9be/mgsm/"
          output = Path("minimal-predictive-lm/public_data/mgsm")
          for name in ("mgsm_ja.tsv", "exemplars.py"):
              (output / name).write_bytes(urlopen(base + name).read())
          PY
      - name: Run public MGSM evaluation
        working-directory: minimal-predictive-lm
        run: |
          mkdir -p results
          python -m minimal_predictive_lm.femi_mgsm \
            public_data/mgsm/mgsm_ja.tsv \
            public_data/mgsm/exemplars.py \
            --adaptation-train 200 \
            | tee results/femi_002_mgsm.json
      - name: Enforce public-data claim boundary
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("results/femi_002_mgsm.json").read_text())
          assert result["passed"] is True
          assert result["neural_network_used"] is False
          assert result["dataset"]["public_rows"] == 250
          assert result["dataset"]["official_exemplars"] == 8
          assert result["dataset"]["adaptation_holdout_rows"] == 50
          assert result["dataset"]["holdout_is_official_zero_shot_score"] is False
          heldout = result["public_adaptation_holdout"]
          assert heldout["accuracy"] >= 0.10
          assert heldout["solved_training_rows"] >= 80
          assert heldout["accuracy"] > heldout["exact_memorization_baseline_accuracy"]
          assert "not Japanese high-school-level intelligence" in result["claim_boundary"]
          protocol = Path("docs/femi_002_mgsm.md").read_text()
          assert "Failure rejects the current learner" in protocol
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: femi-002-mgsm-results
          path: minimal-predictive-lm/results/femi_002_mgsm.json
          retention-days: 14
