name: minimal-predictive-lm-phase18b8
on:
  pull_request:
    paths:
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase18b7_shared_linear_constraint_graph.py'
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase18b8_induced_word_problem_schema.py'
      - 'minimal-predictive-lm/tests/test_phase18b8_induced_word_problem_schema.py'
      - 'minimal-predictive-lm/docs/phase18b8_induced_word_problem_schema.md'
      - '.github/workflows/minimal-predictive-lm-phase18b8.yml'
concurrency:
  group: phase18b8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase18b8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Schema induction theorem tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_phase18b8_induced_word_problem_schema.py
      - name: Run Phase 18b-8 experiment
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.phase18b8_induced_word_problem_schema
      - name: Upload Phase 18b-8 diagnostics and results
        uses: actions/upload-artifact@v4
        with:
          name: phase18b8-results
          path: |
            minimal-predictive-lm/results/phase18b8.json
            minimal-predictive-lm/results/phase18b8.md
          retention-days: 7
