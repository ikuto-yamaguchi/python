name: cap-gen-002-scalable-core

on:
  pull_request:
    branches: [research/minimal-compute-lm]
  workflow_dispatch:

jobs:
  scalable-recurrent-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit tests
        run: >-
          python -m pytest -q
          minimal-predictive-lm/tests/test_scalable_recurrent_core.py
      - name: Run shared latent smoke gate
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.cap_gen_002_shared_latent_smoke
      - name: Enforce honest capacity and claim boundaries
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          row = json.loads(
              Path("results/cap_gen_002_shared_latent_smoke.json").read_text()
          )
          assert row["mechanism_passed"] is True
          assert row["profiles"]["local_4060_bytes"] >= 128 * 1024 * 1024
          assert row["profiles"]["scale_bytes"] > row["profiles"]["local_4060_bytes"]
          assert row["profiles"]["local_4060_training_peak_bytes"] <= 8 * 1024**3
          assert row["cap_gen_002_passed"] is False
          assert row["highschool_level_passed"] is False
          PY
      - name: Upload smoke results
        uses: actions/upload-artifact@v4
        with:
          name: cap-gen-002-scalable-core-results
          path: |
            minimal-predictive-lm/results/cap_gen_002_shared_latent_smoke.json
            minimal-predictive-lm/results/cap_gen_002_shared_latent_smoke.md
          retention-days: 14
