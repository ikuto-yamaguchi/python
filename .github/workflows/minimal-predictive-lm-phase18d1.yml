name: minimal-predictive-lm-phase18d1

on:
  pull_request:
    paths:
      - 'minimal-predictive-lm/data/phase18d1_meta_tasks.json'
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase18d1_dataset_to_program_meta_learner.py'
      - 'minimal-predictive-lm/tests/test_phase18d1_dataset_to_program_meta_learner.py'
      - 'minimal-predictive-lm/docs/phase18d1_dataset_to_program_meta_learner.md'
      - '.github/workflows/minimal-predictive-lm-phase18d1.yml'

concurrency:
  group: phase18d1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase18d1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Dataset-to-program theorem tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_phase18d1_dataset_to_program_meta_learner.py
      - name: Run Phase 18d-1 experiment
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.phase18d1_dataset_to_program_meta_learner
      - name: Upload Phase 18d-1 diagnostics and results
        uses: actions/upload-artifact@v4
        with:
          name: phase18d1-results
          path: |
            minimal-predictive-lm/results/phase18d1.json
            minimal-predictive-lm/results/phase18d1.md
          retention-days: 7
