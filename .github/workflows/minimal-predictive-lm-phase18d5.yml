name: minimal-predictive-lm-phase18d5
on:
  pull_request:
    paths:
      - 'minimal-predictive-lm/data/phase18d5_continuous_raw_stream.json'
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase18d1_dataset_to_program_meta_learner.py'
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase18d3_latent_task_partition.py'
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase18d4_self_supervised_sequence_learning.py'
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase18d5_continuous_raw_segmentation.py'
      - 'minimal-predictive-lm/tests/test_phase18d5_continuous_raw_segmentation.py'
      - 'minimal-predictive-lm/docs/phase18d5_continuous_raw_segmentation.md'
      - '.github/workflows/minimal-predictive-lm-phase18d5.yml'
concurrency:
  group: phase18d5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase18d5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Continuous raw segmentation theorem tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_phase18d5_continuous_raw_segmentation.py
      - name: Run Phase 18d-5 experiment
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.phase18d5_continuous_raw_segmentation
      - name: Upload Phase 18d-5 diagnostics and results
        uses: actions/upload-artifact@v4
        with:
          name: phase18d5-results
          path: |
            minimal-predictive-lm/results/phase18d5.json
            minimal-predictive-lm/results/phase18d5.md
          retention-days: 7
