name: minimal-predictive-lm-phase18c1
on:
  pull_request:
    paths:
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase18c1_multiplicative_relation_core.py'
      - 'minimal-predictive-lm/tests/test_phase18c1_multiplicative_relation_core.py'
      - 'minimal-predictive-lm/docs/phase18c1_multiplicative_relation_core.md'
      - '.github/workflows/minimal-predictive-lm-phase18c1.yml'
concurrency:
  group: phase18c1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase18c1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Multiplicative core theorem tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_phase18c1_multiplicative_relation_core.py
      - name: Run Phase 18c-1 experiment
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.phase18c1_multiplicative_relation_core
      - name: Upload Phase 18c-1 diagnostics and results
        uses: actions/upload-artifact@v4
        with:
          name: phase18c1-results
          path: |
            minimal-predictive-lm/results/phase18c1.json
            minimal-predictive-lm/results/phase18c1.md
          retention-days: 7
