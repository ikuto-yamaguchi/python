name: minimal-predictive-lm-phase17c

on:
  pull_request:
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase17a_*.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase17b_*.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase17c_*.py"
      - "minimal-predictive-lm/tests/test_phase17c_*.py"
      - "minimal-predictive-lm/docs/phase17*.md"
      - ".github/workflows/minimal-predictive-lm-phase17c.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase17c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Factorial resource regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p minimal-predictive-lm/results
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase17c_factorial_resource_scaling.py' -v 2>&1 | tee minimal-predictive-lm/results/phase17c-test.log
      - name: Run independently varied resource pilot
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.phase17c_factorial_resource_scaling
      - name: Upload Phase 17c diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase17c-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            minimal-predictive-lm/results/phase17c-test.log
            minimal-predictive-lm/results/phase17c.json
            minimal-predictive-lm/results/phase17c.md
