name: R0 prediction cell binding tests

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - research/intelligence_swarm/benchmarks/grounded_causal/audit_prediction_cell_binding.py
      - research/intelligence_swarm/benchmarks/grounded_causal/test_audit_prediction_cell_binding.py
      - .github/workflows/r0_prediction_cell_binding_tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile research/intelligence_swarm/benchmarks/grounded_causal/audit_prediction_cell_binding.py research/intelligence_swarm/benchmarks/grounded_causal/test_audit_prediction_cell_binding.py
      - name: Run regression tests
        run: python research/intelligence_swarm/benchmarks/grounded_causal/test_audit_prediction_cell_binding.py
