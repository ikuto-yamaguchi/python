name: Apply HS21 semantic fixes v4

on:
  push:
    branches:
      - research/sparc-hs16-university-gate
    paths:
      - ".github/workflows/apply-hs21-v4-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sparc-hs16-university-gate
      - name: Apply structural source transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def find_one(lines, predicate, name):
              matches = [index for index, line in enumerate(lines) if predicate(line)]
              if len(matches) != 1:
                  raise RuntimeError(f"{name}: expected 1 match, got {matches}")
              return matches[0]

          # 1) Topic boundary: prevent プランニング -> ランニング.
          path = Path("sparc_hs16/sparc_hs16/dialogue_cognition.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          index = find_one(lines, lambda line: "matches = [hint for hint in self.TOPIC_HINTS" in line, "topic-boundary")
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          lines[index:index + 1] = [
              indent + "matches: list[str] = []",
              indent + "for hint in self.TOPIC_HINTS:",
              indent + "    if re.fullmatch(r\"[ァ-ヶー]+\", hint):",
              indent + "        if re.search(rf\"(?<![ァ-ヶー]){re.escape(hint)}(?![ァ-ヶー])\", compact):",
              indent + "            matches.append(hint)",
              indent + "    elif hint.lower() in compact.lower():",
              indent + "        matches.append(hint)",
          ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # 2) Planner structural changes.
          path = Path("sparc_hs16/sparc_hs16/dialogue_planner.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          insert_after = find_one(
              lines,
              lambda line: "chosen_action = _normalize_clause(previous_conflict.group(3), 24)" in line,
              "choice-extraction-anchor",
          )
          choice_extraction = [
              "",
              "        choice_source = \" \".join(value for value in (prior_text, frame.text) if value)",
              "        alternatives: tuple[str, str] | None = None",
              "        for pattern in (",
              "            r\"(.{2,28}?)と(.{2,28}?)のどちら\",",
              "            r\"(.{2,28}?)か[、,]?(.{2,28}?)か(?:で迷|迷って|どっち|どちら)\",",
              "        ):",
              "            choice_match = re.search(pattern, _compact(choice_source))",
              "            if choice_match:",
              "                alternatives = (",
              "                    _normalize_clause(choice_match.group(1), 28),",
              "                    _normalize_clause(choice_match.group(2), 28),",
              "                )",
              "                break",
          ]
          if not any("choice_source =" in line for line in lines):
              lines[insert_after + 1:insert_after + 1] = choice_extraction

          dimension_index = find_one(
              lines,
              lambda line: "で{context_summary}ということなら" in line,
              "dimension-grammar",
          )
          lines[dimension_index] = lines[dimension_index].replace(
              "{topic or 'その件'}で{context_summary}ということなら、",
              "{context_summary}。{topic or 'その件'}では、",
          )

          choice_start = find_one(
              lines,
              lambda line: line.strip() == 'if frame.question_type == "choice":',
              "choice-block-start",
          )
          choice_end = next(
              index for index in range(choice_start + 1, len(lines))
              if lines[index].strip().startswith('if base.act in {"recall"')
          )
          replacement = [
              '        if frame.question_type == "choice":',
              "            if alternatives:",
              "                left_option, right_option = alternatives",
              '                foundation_terms = ("操作", "分かり", "表現", "入力", "理解", "安全", "基礎")',
              "                if any(term in right_option for term in foundation_terms):",
              "                    foundation, enhancement = right_option, left_option",
              "                elif any(term in left_option for term in foundation_terms):",
              "                    foundation, enhancement = left_option, right_option",
              "                else:",
              "                    foundation, enhancement = left_option, right_option",
              "                candidates.append(Candidate(",
              '                    f"今の情報なら、まず{foundation}を優先する。{enhancement}を伸ばしても、"',
              '                    f"{foundation}が弱いと良さを受け取ってもらえないから。{foundation}の最低基準を通した後に、"',
              '                    f"{enhancement}を伸ばす順番がいいと思う。",',
              '                    "ordered-choice",',
              "                ))",
              "            candidates.append(Candidate(",
              '                "二者択一に見えるけれど、先に失敗したときの損失が大きい方を潰すのがよさそう。"',
              '                "その後でもう一方を伸ばせるなら、その順番がいちばん戻りやすい。",',
              '                "risk-first-choice",',
              "            ))",
              "",
              '        if re.search(r"試してみる|やってみる|決めたい|進めたい", _compact(frame.text)):',
              '            if topic in {"ランニング", "マラソン"}:',
              "                candidates.append(Candidate(",
              '                    "いいと思う。次の2回は距離とコースをそろえて、変えるのは前半のペースだけにしよう。"',
              '                    "脚が重くなり始めた距離を記録すれば、前半の入りが原因か比較しやすい。",',
              '                    "commitment-experiment",',
              "                ))",
              '            elif topic in {"研究", "AI", "モデル"}:',
              "                candidates.append(Candidate(",
              '                    "順番を検証可能にしよう。まず表現学習だけを変えた版、次に会話プランナーだけを変えた版を作り、"',
              '                    "同じ隠し会話で比較すれば、どちらが効いたか切り分けられる。",',
              '                    "commitment-experiment",',
              "                ))",
              '            elif topic in {"仕事", "上司"}:',
              "                candidates.append(Candidate(",
              '                    "次に備えて、追加依頼を受けたときの一文を先に決めておくと試しやすい。"',
              '                    "『今の作業とどちらを優先しますか』と確認し、相手の反応と残業時間を記録しよう。",',
              '                    "commitment-experiment",',
              "                ))",
              "            else:",
              "                candidates.append(Candidate(",
              '                    "試すなら、一度に一つだけ変えて、前後で何を比べるかも先に決めておこう。"',
              '                    "結果が悪くても、原因を切り分けられる実験になる。",',
              '                    "commitment-experiment",',
              "                ))",
              "",
          ]
          lines[choice_start:choice_end] = replacement

          generic_index = find_one(
              lines,
              lambda line: "generic_hits = sum(fragment in text" in line,
              "critic-anchor",
          )
          bonus = [
              "        strategy_bonus = {",
              '            "conflict-reflection": 2.5,',
              '            "conflict-empathy": 2.0,',
              '            "counterfactual-advice": 3.0,',
              '            "ordered-choice": 3.0,',
              '            "commitment-experiment": 2.5,',
              "        }.get(candidate.strategy, 0.0)",
              "        if strategy_bonus:",
              "            score += strategy_bonus",
              '            reasons.append("strategy-bonus")',
              '        if candidate.strategy == "topic-dimensions" and frame.question_type == "statement" and frame.emotion == "neutral":',
              "            score -= 1.5",
              '            reasons.append("premature-analysis")',
          ]
          if not any("strategy_bonus =" in line for line in lines):
              lines[generic_index:generic_index] = bonus
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # 3) Evaluation fixes: ties and semantic choice checks.
          path = Path("sparc_hs16/run_dialogue_planner_pilot.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          start = find_one(lines, lambda line: line.strip() == "selected_are_top_scored = all(", "score-check-start")
          end = find_one(lines, lambda line: line.strip() == "candidate_counts = [", "score-check-end")
          lines[start:end] = [
              "    def selected_is_top_scored(turn):",
              '        candidates = turn.get("candidates", [])',
              "        if not candidates:",
              "            return True",
              '        selected = next(row for row in candidates if row["text"] == turn["assistant"])',
              '        return selected["score"] == max(row["score"] for row in candidates)',
              "",
              "    selected_are_top_scored = all(",
              "        selected_is_top_scored(turn)",
              "        for scenario in hs21_transcripts",
              '        for turn in scenario["turns"]',
              "    )",
              "",
          ]
          research = find_one(lines, lambda line: '"research_response_uses_tradeoff"' in line, "research-check")
          lines[research:research + 1] = [
              '        "research_response_uses_tradeoff": (',
              '            "表現学習" in research[3]["assistant"]',
              '            and "会話プランニング" in research[3]["assistant"]',
              '            and any(term in research[3]["assistant"] for term in ("先", "優先", "前提", "順番"))',
              "        ),",
          ]
          game = find_one(lines, lambda line: '"game_choice_is_direct"' in line, "game-check")
          lines[game:game + 1] = [
              '        "game_choice_is_direct": (',
              '            "操作" in game[3]["assistant"]',
              '            and "面白" in game[3]["assistant"]',
              '            and any(term in game[3]["assistant"] for term in ("先", "優先", "順番"))',
              "        ),",
          ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python -m py_compile \
            sparc_hs16/sparc_hs16/dialogue_cognition.py \
            sparc_hs16/sparc_hs16/dialogue_planner.py \
            sparc_hs16/run_dialogue_planner_pilot.py
          git diff --check
      - name: Commit structural semantic fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            sparc_hs16/sparc_hs16/dialogue_cognition.py \
            sparc_hs16/sparc_hs16/dialogue_planner.py \
            sparc_hs16/run_dialogue_planner_pilot.py
          git commit -m "fix: HS21の語境界・選択推論・実験提案を改善"
          git push origin HEAD:research/sparc-hs16-university-gate
