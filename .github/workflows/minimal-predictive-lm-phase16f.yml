name: minimal-predictive-lm-phase16f

on:
  pull_request:
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/induced_clause_compiler.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/induced_proposition_machine.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase16f_*.py"
      - "minimal-predictive-lm/tests/test_phase16f_*.py"
      - "minimal-predictive-lm/pyproject.toml"
      - ".github/workflows/minimal-predictive-lm-phase16f.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase16f:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Induced clause compiler tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p minimal-predictive-lm/results
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase16f_*.py' -v 2>&1 | tee minimal-predictive-lm/results/phase16f-test.log
      - name: Run supervised clause induction audit
        working-directory: minimal-predictive-lm
        run: mpm-phase16f
      - name: Upload Phase 16f diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase16f-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            minimal-predictive-lm/results/phase16f-test.log
            minimal-predictive-lm/results/phase16f.json
            minimal-predictive-lm/results/phase16f.md
