name: sparc-narrative-world-001

on:
  pull_request:
    branches: [research/minimal-compute-lm]
  workflow_dispatch:

jobs:
  narrative-world:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit tests
        run: pytest -q minimal-predictive-lm/tests/test_sparc_narrative_world.py | tee narrative-world-unit.log
      - name: Run narrative-world gate
        run: python -m minimal_predictive_lm.sparc_narrative_world_gate --output-dir minimal-predictive-lm/results | tee narrative-world-gate.log
      - name: Upload results or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparc-narrative-world-001-results
          path: |
            minimal-predictive-lm/results/sparc_narrative_world_001.json
            minimal-predictive-lm/results/sparc_narrative_world_001.md
            minimal-predictive-lm/results/SPARC-narrative-world-001.model.zlib
            narrative-world-unit.log
            narrative-world-gate.log
      - name: Enforce gate
        run: |
          python - <<'PY'
          import json
          result=json.load(open('minimal-predictive-lm/results/sparc_narrative_world_001.json'))
          assert result['passed'], result['checks']
          PY
