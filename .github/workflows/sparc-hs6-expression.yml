name: sparc-hs6-expression

on:
  pull_request:
    branches: [research/minimal-compute-lm]
  workflow_dispatch:

jobs:
  hs6-expression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_sparc_expression.py
      - name: Train and evaluate SPARC-HS6
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.sparc_hs6_experiment
      - name: Upload model and report
        uses: actions/upload-artifact@v4
        with:
          name: sparc-hs6-expression-results
          path: minimal-predictive-lm/results
          retention-days: 14
      - name: Enforce capability and resource gates
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results/sparc_hs6_expression.json').read_text())
          scale = result['large_expression_bank']
          assert result['passed'] is True
          assert result['passed_checks'] == result['total_checks'] == 10
          assert result['dynamic_expression_synthesis'] is True
          assert result['backward_relevance_search'] is True
          assert result['shared_expression_tree'] is True
          assert result['transformer_used'] is False
          assert result['softmax_attention_used'] is False
          assert result['growing_kv_cache_used'] is False
          assert scale['expression_schemas'] == 10001
          assert scale['unique_expression_trees'] == 1
          assert scale['correct_queries'] == scale['sample_queries'] == 512
          assert scale['max_candidates_observed'] <= 32
          assert scale['max_anchor_reads_observed'] <= 128
          assert scale['max_expression_cost_observed'] == 9
          assert scale['synthesis_semantic_states'] <= 2000
          assert scale['global_expression_scan_used'] is False
          assert scale['serialized_bytes'] <= 1000000
          assert result['peak_process_kib'] <= 1000000
          assert result['elapsed_seconds'] <= 120
          PY
