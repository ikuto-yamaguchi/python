name: R0-D Cycle 079 shuffle metric scope

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - research/intelligence_swarm/benchmarks/grounded_causal/apply_r0d_cycle_079_shuffle_metric_scope.py
      - research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_shuffle_metric_scope_cycle_079.py
      - .github/workflows/r0d_cycle_079_shuffle_metric_scope.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/intelligence-swarm-reconstruction-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply fail-closed core patch
        run: python research/intelligence_swarm/benchmarks/grounded_causal/apply_r0d_cycle_079_shuffle_metric_scope.py
      - name: Compile core and regression
        run: |
          python -m py_compile research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py
          python -m py_compile research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_shuffle_metric_scope_cycle_079.py
      - name: Run focused regression
        run: python research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_shuffle_metric_scope_cycle_079.py
      - name: Commit to canonical branch only
        run: |
          if git diff --quiet -- research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py; then
            echo 'Core already contains Cycle 079 changes.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py
          git commit -m 'R0-D Cycle 079: scope shuffle statistics to bound metrics'
          git push origin HEAD:research/intelligence-swarm-reconstruction-001
