name: minimal-predictive-lm-phase18b6

on:
  pull_request:
    paths:
      - "minimal-predictive-lm/**"
      - ".github/workflows/minimal-predictive-lm-phase18b6.yml"
  push:
    branches: [main]
    paths:
      - "minimal-predictive-lm/**"
      - ".github/workflows/minimal-predictive-lm-phase18b6.yml"

concurrency:
  group: phase18b6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase18b6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit-rate word-problem theorem tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_phase18b6_unit_rate_word_problems.py
      - name: Run Phase 18b-6 experiment
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.phase18b6_unit_rate_word_problems
      - name: Upload Phase 18b-6 diagnostics and results
        uses: actions/upload-artifact@v4
        with:
          name: phase18b6-results
          path: |
            minimal-predictive-lm/results/phase18b6.json
            minimal-predictive-lm/results/phase18b6.md
          retention-days: 7
