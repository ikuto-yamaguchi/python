name: sparc-hs18-causal-gate

on:
  pull_request:
    branches: [research/minimal-compute-lm]
  workflow_dispatch:

concurrency:
  group: sparc-hs18-causal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hs18-causal-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          mkdir -p minimal-predictive-lm/results
          set -o pipefail
          python -m pytest -vv \
            minimal-predictive-lm/tests/test_english_causal_compiler.py \
            minimal-predictive-lm/tests/test_english_causal_compiler_v3.py \
            2>&1 | tee minimal-predictive-lm/results/hs18_unit.log
      - name: Run integrated, development, and frozen V3 causal gates
        id: experiment
        continue-on-error: true
        working-directory: minimal-predictive-lm
        run: |
          set -o pipefail
          python -m minimal_predictive_lm.sparc_hs18_causal_gate_v3_runtime 2>&1 | tee ../sparc-hs18-causal-gate.log
      - name: Upload results or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparc-hs18-causal-gate-results
          path: |
            minimal-predictive-lm/results/hs18_unit.log
            minimal-predictive-lm/results/sparc_hs18_causal_gate_v3.json
            minimal-predictive-lm/results/sparc_hs18_causal_gate_v3.md
            sparc-hs18-causal-gate.log
          retention-days: 14
      - name: Enforce gate
        if: always()
        run: |
          test "${{ steps.unit.outcome }}" = "success"
          test "${{ steps.experiment.outcome }}" = "success"
