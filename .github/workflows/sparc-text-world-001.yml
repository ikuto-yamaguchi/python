name: sparc-text-world-001

on:
  pull_request:
    branches:
      - research/minimal-compute-lm
    paths:
      - 'minimal-predictive-lm/**'
      - '.github/workflows/sparc-text-world-001.yml'
  workflow_dispatch:

jobs:
  text-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: minimal-predictive-lm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_text_world_learner.py
      - name: Run text-world gate
        run: python -m minimal_predictive_lm.sparc_text_world_gate | tee sparc-text-world-001.log
      - name: Upload results or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparc-text-world-001-results
          path: |
            minimal-predictive-lm/sparc-text-world-001.json
            minimal-predictive-lm/SPARC-TEXT-WORLD-001.model.zlib
            minimal-predictive-lm/sparc-text-world-001.log
          if-no-files-found: warn
