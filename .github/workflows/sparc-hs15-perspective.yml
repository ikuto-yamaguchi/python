name: sparc-hs15-perspective

on:
  pull_request:
    branches: [research/minimal-compute-lm]
  workflow_dispatch:

jobs:
  hs15-perspective:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit tests
        run: >-
          python -m pytest -q
          minimal-predictive-lm/tests/test_sparc_relational_plans.py
          minimal-predictive-lm/tests/test_sparc_perspective_state.py
      - name: Train and evaluate SPARC-HS15
        working-directory: minimal-predictive-lm
        run: |
          mkdir -p results
          python - <<'PY'
          import traceback
          from pathlib import Path
          from minimal_predictive_lm.sparc_hs15_experiment import run_experiment

          try:
              result = run_experiment()
              print(result)
          except BaseException:
              Path('results/hs15_error.txt').write_text(
                  traceback.format_exc(), encoding='utf-8'
              )
              raise
          PY
      - name: Upload model, report, or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparc-hs15-perspective-results
          path: minimal-predictive-lm/results
          retention-days: 14
      - name: Enforce capability and resource gates
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results/sparc_hs15_perspective_state.json').read_text())
          scale = result['large_perspective_memory']
          assert result['passed'] is True
          assert result['passed_checks'] == result['total_checks'] == 13
          assert result['transformer_used'] is False
          assert result['softmax_attention_used'] is False
          assert result['growing_kv_cache_used'] is False
          assert scale['objects'] == 50000
          assert scale['world_slots'] == 50000
          assert scale['belief_slots'] == 150000
          assert scale['events'] == 50000
          assert scale['correct_world_queries'] == scale['sample_queries'] == 512
          assert scale['correct_observer_queries'] == scale['sample_queries'] == 512
          assert scale['correct_false_belief_queries'] == scale['sample_queries'] == 512
          assert scale['correct_pronoun_queries'] == scale['sample_queries'] == 512
          assert scale['correct_cause_queries'] == scale['sample_queries'] == 512
          assert scale['max_event_candidates'] <= 1
          assert scale['max_query_candidates'] <= 3
          assert scale['max_schema_reads'] <= 32
          assert scale['max_state_reads'] <= 1
          assert scale['max_focus_reads'] <= 4
          assert scale['max_estimated_operations'] <= 32
          assert scale['serialized_bytes'] <= 15000000
          assert result['peak_process_kib'] <= 1200000
          assert result['elapsed_seconds'] <= 120
          PY
