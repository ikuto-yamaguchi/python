name: Dual-timescale surprise consensus

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "minimal-predictive-lm/reproductions/dual_timescale_surprise_consensus/**"
      - ".github/workflows/dual-timescale-surprise-consensus.yml"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: minimal-predictive-lm/reproductions/dual_timescale_surprise_consensus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Multi-seed scaling experiment
        env:
          PYTHONHASHSEED: "0"
        run: python dual_timescale_surprise_consensus.py --output artifacts/dual_timescale_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: dual-timescale-surprise-consensus-report
          path: minimal-predictive-lm/reproductions/dual_timescale_surprise_consensus/artifacts/dual_timescale_report.json
