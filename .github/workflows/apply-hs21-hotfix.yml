name: Apply HS21 one-line hotfix

on:
  push:
    branches:
      - research/sparc-hs16-university-gate
    paths:
      - ".github/workflows/apply-hs21-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sparc-hs16-university-gate
      - name: Replace invalid deduplication expression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("sparc_hs16/sparc_hs16/dialogue_planner.py")
          text = path.read_text(encoding="utf-8")
          old = "return tuple(dict.fromkeys((candidate.text, candidate.strategy)) and candidates)"
          new = "return tuple(candidates)"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one target, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          test "$(git diff --numstat | awk '{a+=$1; d+=$2} END {print a+0, d+0}')" = "1 1"
      - name: Commit the exact patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sparc_hs16/sparc_hs16/dialogue_planner.py
          git commit -m "fix: HS21候補リストのNameErrorを修正"
          git push origin HEAD:research/sparc-hs16-university-gate
