name: minimal-predictive-lm

on:
  push:
    branches:
      - main
    paths:
      - "minimal-predictive-lm/**"
      - ".github/workflows/minimal-predictive-lm.yml"
  pull_request:
    paths:
      - "minimal-predictive-lm/**"
      - ".github/workflows/minimal-predictive-lm.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Phase 11 to 13 induction and public-baseline tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p minimal-predictive-lm/results
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase11a_universal_program_induction.py' -v 2>&1 | tee minimal-predictive-lm/results/phase11a-test.log
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase11b_macro_library.py' -v 2>&1 | tee minimal-predictive-lm/results/phase11b-test.log
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase11c_primitive_invention.py' -v 2>&1 | tee minimal-predictive-lm/results/phase11c-test.log
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase11d_raw_primitive_grounding.py' -v 2>&1 | tee minimal-predictive-lm/results/phase11d-test.log
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase11e_continuous_stream.py' -v 2>&1 | tee minimal-predictive-lm/results/phase11e-test.log
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase12a_mixed_task_learner.py' -v 2>&1 | tee minimal-predictive-lm/results/phase12a-test.log
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase13a_public_multi_domain_baseline.py' -v 2>&1 | tee minimal-predictive-lm/results/phase13a-test.log
      - name: Upload Phase 11 to 13 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-13-test-logs
          retention-days: 7
          path: |
            minimal-predictive-lm/results/phase11a-test.log
            minimal-predictive-lm/results/phase11b-test.log
            minimal-predictive-lm/results/phase11c-test.log
            minimal-predictive-lm/results/phase11d-test.log
            minimal-predictive-lm/results/phase11e-test.log
            minimal-predictive-lm/results/phase12a-test.log
            minimal-predictive-lm/results/phase13a-test.log
      - name: Phase 9 and Stage C tests
        run: |
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase9a_raw_event_program.py' -v
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase9b_event_graph.py' -v
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase9c_connector_induction.py' -v
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase10a_stage_c_readiness.py' -v
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase10b_math_program.py' -v
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase10c_concept_first.py' -v
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase10d_grounded_knowledge.py' -v
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase10e_raw_document_knowledge.py' -v
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase10f_benchmark_harness.py' -v
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase10g_public_benchmark.py' -v
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase10h_bigbench_arithmetic.py' -v
      - name: Unit tests
        run: python -m unittest discover -s minimal-predictive-lm/tests -v
      - name: Reproduce experiments
        working-directory: minimal-predictive-lm
        run: |
          mpm-phase1
          mpm-phase2
          mpm-phase3a
          mpm-phase4a
          mpm-phase5a
          mpm-phase6a
          mpm-phase6c
          mpm-phase7a
          mpm-phase8a
          mpm-phase8b
          mpm-phase8c
          mpm-phase8d
          mpm-phase8e
          mpm-phase8f
          mpm-phase8g
          mpm-phase9a
          mpm-phase9b
          mpm-phase9c
          mpm-phase10a
          mpm-phase10b
          mpm-phase10c
          mpm-phase10d
          mpm-phase10e
          mpm-phase10f
          mpm-phase10g
          mpm-phase10h
          mpm-phase11a
          mpm-phase11b
          mpm-phase11c
          mpm-phase11d
          mpm-phase11e
          mpm-phase12a
          mpm-phase13a
      - name: Upload Phase 9, Stage C, Phase 11, Phase 12, and Phase 13 results
        uses: actions/upload-artifact@v4
        with:
          name: phase9-stage-c-results
          retention-days: 7
          path: |
            minimal-predictive-lm/results/phase9a.json
            minimal-predictive-lm/results/phase9a.md
            minimal-predictive-lm/results/phase9b.json
            minimal-predictive-lm/results/phase9b.md
            minimal-predictive-lm/results/phase9c.json
            minimal-predictive-lm/results/phase9c.md
            minimal-predictive-lm/results/phase10a.json
            minimal-predictive-lm/results/phase10a.md
            minimal-predictive-lm/results/phase10b.json
            minimal-predictive-lm/results/phase10b.md
            minimal-predictive-lm/results/phase10c.json
            minimal-predictive-lm/results/phase10c.md
            minimal-predictive-lm/results/phase10d.json
            minimal-predictive-lm/results/phase10d.md
            minimal-predictive-lm/results/phase10e.json
            minimal-predictive-lm/results/phase10e.md
            minimal-predictive-lm/results/phase10f.json
            minimal-predictive-lm/results/phase10f.md
            minimal-predictive-lm/results/phase10g.json
            minimal-predictive-lm/results/phase10g.md
            minimal-predictive-lm/results/phase10h.json
            minimal-predictive-lm/results/phase10h.md
            minimal-predictive-lm/results/phase11a.json
            minimal-predictive-lm/results/phase11a.md
            minimal-predictive-lm/results/phase11b.json
            minimal-predictive-lm/results/phase11b.md
            minimal-predictive-lm/results/phase11c.json
            minimal-predictive-lm/results/phase11c.md
            minimal-predictive-lm/results/phase11d.json
            minimal-predictive-lm/results/phase11d.md
            minimal-predictive-lm/results/phase11e.json
            minimal-predictive-lm/results/phase11e.md
            minimal-predictive-lm/results/phase12a.json
            minimal-predictive-lm/results/phase12a.md
            minimal-predictive-lm/results/phase13a.json
            minimal-predictive-lm/results/phase13a.md
