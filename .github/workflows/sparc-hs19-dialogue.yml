name: sparc-hs19-dialogue

on:
  pull_request:
    branches: [research/sparc-causal-compiler-001]
  workflow_dispatch:

concurrency:
  group: sparc-hs19-dialogue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hs19-dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          mkdir -p minimal-predictive-lm/results
          set -o pipefail
          python -m pytest -vv \
            minimal-predictive-lm/tests/test_sparc_dialogue_composer.py \
            2>&1 | tee minimal-predictive-lm/results/hs19_unit.log
      - name: Run compositional dialogue gate
        id: experiment
        continue-on-error: true
        working-directory: minimal-predictive-lm
        run: |
          set -o pipefail
          python -m minimal_predictive_lm.sparc_hs19_dialogue_gate \
            2>&1 | tee ../sparc-hs19-dialogue.log
      - name: Upload results or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparc-hs19-dialogue-results
          path: |
            minimal-predictive-lm/results/hs19_unit.log
            minimal-predictive-lm/results/sparc_hs19_dialogue.json
            minimal-predictive-lm/results/sparc_hs19_dialogue.md
            minimal-predictive-lm/results/SPARC-HS19-dialogue.model.zlib
            sparc-hs19-dialogue.log
          retention-days: 14
      - name: Enforce gate
        if: always()
        run: |
          test "${{ steps.unit.outcome }}" = "success"
          test "${{ steps.experiment.outcome }}" = "success"
