name: Version-space program composition

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "minimal-predictive-lm/reproductions/version_space_program_composition/**"
      - ".github/workflows/version-space-program-composition.yml"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: minimal-predictive-lm/reproductions/version_space_program_composition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
      - name: Counterexample tests
        run: python -m pytest -q test_version_space_program_composition.py
      - name: Multi-seed scaling experiment
        run: python version_space_program_composition.py --output artifacts/version_space_program_composition_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: version-space-program-composition-report
          path: minimal-predictive-lm/reproductions/version_space_program_composition/artifacts/version_space_program_composition_report.json