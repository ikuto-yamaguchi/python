name: sparc-hs9-discourse

on:
  pull_request:
    branches: [research/minimal-compute-lm]
  workflow_dispatch:

jobs:
  hs9-discourse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_sparc_discourse_compact.py
      - name: Train and evaluate SPARC-HS9
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.sparc_hs9_compact_experiment
      - name: Upload model and report
        uses: actions/upload-artifact@v4
        with:
          name: sparc-hs9-discourse-results
          path: minimal-predictive-lm/results
          retention-days: 14
      - name: Enforce capability and resource gates
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results/sparc_hs9_discourse.json').read_text())
          scale = result['large_discourse_graph']
          assert result['passed'] is True
          assert result['passed_checks'] == result['total_checks'] == 10
          assert result['transformer_used'] is False
          assert result['softmax_attention_used'] is False
          assert result['growing_kv_cache_used'] is False
          assert result['global_edge_scan_used'] is False
          assert scale['documents'] == 20000
          assert scale['nodes'] == 100000
          assert scale['correct_queries'] == scale['sample_queries'] == 512
          assert scale['max_candidates_observed'] <= 2
          assert scale['max_anchor_reads_observed'] == 0
          assert scale['max_edge_reads_observed'] <= 8
          assert scale['max_estimated_operations'] <= 256
          assert scale['posting_edges'] <= scale['documents'] * 96
          assert scale['selective_anchor_index'] is True
          assert scale['global_edge_scan_used'] is False
          assert scale['full_document_scan_used'] is False
          assert scale['serialized_bytes'] <= 20000000
          assert result['peak_process_kib'] <= 1000000
          assert result['elapsed_seconds'] <= 120
          PY
