name: HashJump Qwen3.8-27B real-task CPU evaluation
on:
  push:
    branches:
      - research/hashjump-qwen38-27b-20261031
  workflow_dispatch:

concurrency:
  group: hashjump-qwen38-27b-real
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  task-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Execute real-model task success test
        shell: bash
        run: bash research/hashjump_qwen38_27b/eval_27b.sh
      - name: Archive task answers and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hashjump-qwen38-27b-tasks
          path: hashjump_eval_results/
          retention-days: 7
          if-no-files-found: warn
