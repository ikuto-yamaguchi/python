name: HashJump Qwen3.8-27B real-model CPU benchmark
on:
  push:
    branches:
      - research/hashjump-qwen38-27b-20261031
  workflow_dispatch:

concurrency:
  group: hashjump-qwen38-27b-real
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Run actual Qwen3.8-27B baseline and 4-layer ablation
        shell: bash
        run: bash research/hashjump_qwen38_27b/run_27b.sh
      - name: Store measured logs and result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hashjump-qwen38-27b-cpu-results
          path: hashjump_results/
          retention-days: 7
          if-no-files-found: warn
