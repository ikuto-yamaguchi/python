name: sparc-highschool-long-temporal-001

on:
  pull_request:
    branches: [research/minimal-compute-lm]
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_highschool_long_temporal.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_highschool_long_temporal_gate.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_highschool_counterfactual.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_highschool_counterfactual_gate.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_highschool_narrative_alignment.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_highschool_narrative_alignment_gate.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_highschool_grounded_explanation.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_highschool_grounded_explanation_gate.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_highschool_causal_provenance.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_highschool_causal_provenance_gate.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_highschool_intervention_lattice.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_highschool_intervention_lattice_gate.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_highschool_implicit_world.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_highschool_implicit_world_gate.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_highschool_latent_state_graph.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_highschool_latent_state_graph_gate.py"
      - "minimal-predictive-lm/tests/test_sparc_highschool_long_temporal.py"
      - "minimal-predictive-lm/tests/test_sparc_highschool_counterfactual.py"
      - "minimal-predictive-lm/tests/test_sparc_highschool_narrative_alignment.py"
      - "minimal-predictive-lm/tests/test_sparc_highschool_grounded_explanation.py"
      - "minimal-predictive-lm/tests/test_sparc_highschool_causal_provenance.py"
      - "minimal-predictive-lm/tests/test_sparc_highschool_intervention_lattice.py"
      - "minimal-predictive-lm/tests/test_sparc_highschool_implicit_world.py"
      - "minimal-predictive-lm/tests/test_sparc_highschool_latent_state_graph.py"
      - ".github/workflows/sparc-highschool-long-temporal-001.yml"
  workflow_dispatch:

jobs:
  long-temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Unit tests
        run: |
          mkdir -p artifacts/sparc-highschool-long-temporal-001
          set +e
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_sparc_highschool_long_temporal.py' -v 2>&1 | tee artifacts/sparc-highschool-long-temporal-001/tests-long.log
          LONG_EXIT=${PIPESTATUS[0]}
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_sparc_highschool_counterfactual.py' -v 2>&1 | tee artifacts/sparc-highschool-long-temporal-001/tests-counterfactual.log
          CF_EXIT=${PIPESTATUS[0]}
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_sparc_highschool_narrative_alignment.py' -v 2>&1 | tee artifacts/sparc-highschool-long-temporal-001/tests-narrative.log
          NARRATIVE_EXIT=${PIPESTATUS[0]}
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_sparc_highschool_grounded_explanation.py' -v 2>&1 | tee artifacts/sparc-highschool-long-temporal-001/tests-explanation.log
          EXPLANATION_EXIT=${PIPESTATUS[0]}
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_sparc_highschool_causal_provenance.py' -v 2>&1 | tee artifacts/sparc-highschool-long-temporal-001/tests-provenance.log
          PROVENANCE_EXIT=${PIPESTATUS[0]}
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_sparc_highschool_intervention_lattice.py' -v 2>&1 | tee artifacts/sparc-highschool-long-temporal-001/tests-intervention-lattice.log
          LATTICE_EXIT=${PIPESTATUS[0]}
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_sparc_highschool_implicit_world.py' -v 2>&1 | tee artifacts/sparc-highschool-long-temporal-001/tests-implicit-world.log
          IMPLICIT_EXIT=${PIPESTATUS[0]}
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_sparc_highschool_latent_state_graph.py' -v 2>&1 | tee artifacts/sparc-highschool-long-temporal-001/tests-latent-state-graph.log
          LATENT_EXIT=${PIPESTATUS[0]}
          test "$LONG_EXIT" = "0" -a "$CF_EXIT" = "0" -a "$NARRATIVE_EXIT" = "0" -a "$EXPLANATION_EXIT" = "0" -a "$PROVENANCE_EXIT" = "0" -a "$LATTICE_EXIT" = "0" -a "$IMPLICIT_EXIT" = "0" -a "$LATENT_EXIT" = "0"
          echo $? > artifacts/sparc-highschool-long-temporal-001/tests.exit
          exit 0
      - name: Run expanded integrated gate
        continue-on-error: true
        run: python -m minimal_predictive_lm.sparc_highschool_latent_state_graph_gate --output-dir artifacts/sparc-highschool-long-temporal-001 2>&1 | tee artifacts/sparc-highschool-long-temporal-001/gate.log
      - name: Upload results or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparc-highschool-long-temporal-001-results
          path: artifacts/sparc-highschool-long-temporal-001
          retention-days: 90
      - name: Enforce gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/sparc-highschool-long-temporal-001")
          if root.joinpath("tests.exit").read_text().strip() != "0":
              raise SystemExit("integrated unit tests failed")
          report = json.loads(root.joinpath("SPARC-highschool-general-latent-state-graph.json").read_text())
          if not report["passed"]:
              raise SystemExit("expanded integrated gate failed")
          if not report["aggregate_improved"] or not report["no_regression"]:
              raise SystemExit("promotion rule failed")
          PY
