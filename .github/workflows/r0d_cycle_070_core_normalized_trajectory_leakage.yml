name: R0D Cycle 070 core normalized trajectory leakage

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - research/intelligence_swarm/governance/apply_r0d_cycle_070_core_normalized_trajectory_leakage.py
      - research/intelligence_swarm/governance/test_evaluation_contract_normalized_trajectory_leakage_core.py
      - .github/workflows/r0d_cycle_070_core_normalized_trajectory_leakage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/intelligence-swarm-reconstruction-001
          fetch-depth: 0
      - name: Apply normalized trajectory leakage hardening
        run: python research/intelligence_swarm/governance/apply_r0d_cycle_070_core_normalized_trajectory_leakage.py
      - name: Compile
        run: python -m py_compile research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py research/intelligence_swarm/governance/test_evaluation_contract_normalized_trajectory_leakage_core.py
      - name: Run focused regression
        run: python research/intelligence_swarm/governance/test_evaluation_contract_normalized_trajectory_leakage_core.py
      - name: Save cycle report
        run: |
          cat > research/intelligence_swarm/governance/REPORT_R0D_CYCLE_070.md <<'EOF'
          # R0-D Cycle 070 — normalized completed-trajectory leakage identities

          `validate_dataset()` now canonicalizes `episode_id`, `episode_seed`, and `observation_fingerprint` before comparing train and evaluation splits. Unicode width/case differences, whitespace/control-format characters, numeric-vs-string aliases, and recursively structured identity aliases can no longer disguise completed-trajectory reuse.

          The audit artifact records `normalized_trajectory_identity_required=true` and the normalization rule. Any normalized train/evaluation overlap is classified as `initial_reproduction_failure`. No memory, replay, fast-weights, sleep, or forgetting mechanism was added.
          EOF
      - name: Commit to canonical branch
        run: |
          if git diff --quiet; then
            echo "No core changes required"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py research/intelligence_swarm/governance/REPORT_R0D_CYCLE_070.md
          git commit -m "r0d: normalize completed trajectory leakage identities"
          git push origin HEAD:research/intelligence-swarm-reconstruction-001
