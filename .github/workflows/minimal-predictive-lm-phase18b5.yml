name: minimal-predictive-lm-phase18b5

on:
  pull_request:
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase18b5_*.py"
      - "minimal-predictive-lm/tests/test_phase18b5_*.py"
      - "minimal-predictive-lm/docs/phase18b5_*.md"
      - ".github/workflows/minimal-predictive-lm-phase18b5.yml"
  push:
    branches: [main]
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase18b5_*.py"
      - "minimal-predictive-lm/tests/test_phase18b5_*.py"
      - "minimal-predictive-lm/docs/phase18b5_*.md"
      - ".github/workflows/minimal-predictive-lm-phase18b5.yml"
  workflow_dispatch:

concurrency:
  group: phase18b5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase18b5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Affine inequality theorem tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_phase18b5_affine_inequality_reasoning.py
      - name: Run Phase 18b-5 experiment
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.phase18b5_affine_inequality_reasoning
      - name: Upload Phase 18b-5 diagnostics and results
        uses: actions/upload-artifact@v4
        with:
          name: phase18b5-results
          path: |
            minimal-predictive-lm/results/phase18b5.json
            minimal-predictive-lm/results/phase18b5.md
          retention-days: 7
