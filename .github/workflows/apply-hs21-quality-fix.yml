name: Apply HS21 dialogue quality fixes

on:
  push:
    branches:
      - research/sparc-hs16-university-gate
    paths:
      - ".github/workflows/apply-hs21-quality-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sparc-hs16-university-gate
      - name: Apply exact dialogue quality patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("sparc_hs16/sparc_hs16/dialogue_planner.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'value = re.sub(r"(?:だよ|なんだ|でさ|だね|です|ます)$", "", value)',
                  'value = re.sub(r"(?:だったよ|だよ|なんだ|でさ|だね|です|ます|よ|ね|さ)$", "", value)',
              ),
              (
                  '        summary = _normalize_clause(frame.text)\n        topic = frame.topic or (frame.key_terms[0] if frame.key_terms else None)\n        dimensions = _TOPIC_DIMENSIONS.get(frame.topic or "", ())\n',
                  '        summary = _normalize_clause(frame.text)\n        topic = frame.topic or (frame.key_terms[0] if frame.key_terms else None)\n        dimensions = _TOPIC_DIMENSIONS.get(frame.topic or "", ())\n        context_summary = summary\n        prior_text = ""\n        if state.current_topic and state.current_topic in state.topics:\n            propositions = state.topics[state.current_topic].propositions\n            if len(propositions) >= 2:\n                prior_text = propositions[-2]\n                if frame.question_type != "statement":\n                    context_summary = _normalize_clause(prior_text)\n        conflict_choice = frame.conflict_choice\n        feared_outcome = frame.feared_outcome\n        chosen_action = frame.chosen_action\n        if prior_text and not (conflict_choice and feared_outcome and chosen_action):\n            previous_conflict = re.search(\n                r"(.{1,18}?)(?:たら|ると)(.{1,28}?)(?:そう|かも)(?:で|だから)[、,]?(?:結局)?(.{1,24})",\n                _compact(prior_text),\n            )\n            if previous_conflict:\n                conflict_choice = _normalize_clause(previous_conflict.group(1), 20)\n                feared_outcome = _normalize_clause(previous_conflict.group(2), 28)\n                chosen_action = _normalize_clause(previous_conflict.group(3), 24)\n',
              ),
              ('if frame.conflict_choice and frame.feared_outcome and frame.chosen_action:', 'if conflict_choice and feared_outcome and chosen_action:'),
              ('{frame.feared_outcome}', '{feared_outcome}'),
              ('{frame.chosen_action}', '{chosen_action}'),
              ('{frame.conflict_choice}', '{conflict_choice}'),
              (
                  '        if base.act in {"acknowledge", "explore", "celebrate"}:\n            if frame.timing:\n',
                  '        if base.act in {"acknowledge", "explore", "celebrate"}:\n            if conflict_choice and feared_outcome and chosen_action:\n                candidates.append(Candidate(\n                    f"{feared_outcome}のが気になって、{chosen_action}んだね。"\n                    "断るか引き受けるかの二択に追い込まれたこと自体が負担だったように見える。",\n                    "conflict-reflection",\n                ))\n            if frame.timing and (frame.actor or frame.topic in {"仕事", "上司"} or "直前" in frame.timing):\n',
              ),
              (
                  'f"{summary}ということなら、{left}と{right}を分けて考えると原因が見えやすい。今の感覚ではどちらが近い？",',
                  'f"{topic or \'その件\'}で{context_summary}ということなら、{left}と{right}を分けて考えると原因が見えやすい。今の感覚ではどちらが近い？",',
              ),
              (
                  'f"{summary}んだね。そこでは『何が起きたか』より『何が予想と違ったか』が気になる。いちばん意外だったのはどこ？",',
                  'f"{context_summary}んだね。そこでは『何が起きたか』より『何が予想と違ったか』が気になる。いちばん意外だったのはどこ？",',
              ),
              (
                  'f"{summary}という状況なんだね。次に変えたいのは結果そのもの、それともそこに至る過程？",',
                  'f"{context_summary}という状況なんだね。次に変えたいのは結果そのもの、それともそこに至る過程？",',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"patch target missing: {old[:80]!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile sparc_hs16/sparc_hs16/dialogue_planner.py
          git diff --check
      - name: Commit quality fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sparc_hs16/sparc_hs16/dialogue_planner.py
          git commit -m "fix: HS21の直前文脈参照と日本語生成を改善"
          git push origin HEAD:research/sparc-hs16-university-gate
