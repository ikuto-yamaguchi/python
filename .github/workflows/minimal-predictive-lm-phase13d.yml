name: minimal-predictive-lm-phase13d

on:
  pull_request:
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/generic_quantifier.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase13d_*.py"
      - "minimal-predictive-lm/tests/test_phase13d_*.py"
      - "minimal-predictive-lm/pyproject.toml"
      - ".github/workflows/minimal-predictive-lm-phase13d.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase13d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Quantifier regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p minimal-predictive-lm/results
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase13d_generic_quantifier.py' -v 2>&1 | tee minimal-predictive-lm/results/phase13d-test.log
      - name: Upload Phase 13d diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13d-diagnostics
          retention-days: 7
          path: minimal-predictive-lm/results/phase13d-test.log
      - name: Run public Phase 13d experiment
        working-directory: minimal-predictive-lm
        run: mpm-phase13d
      - name: Upload Phase 13d result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13d-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            minimal-predictive-lm/results/phase13d.json
            minimal-predictive-lm/results/phase13d.md
