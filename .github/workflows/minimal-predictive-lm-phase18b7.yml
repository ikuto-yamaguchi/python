name: minimal-predictive-lm-phase18b7
on:
  pull_request:
    paths:
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase18b7_shared_linear_constraint_graph.py'
      - 'minimal-predictive-lm/tests/test_phase18b7_shared_linear_constraint_graph.py'
      - 'minimal-predictive-lm/docs/phase18b7_shared_linear_constraint_graph.md'
      - '.github/workflows/minimal-predictive-lm-phase18b7.yml'
concurrency:
  group: phase18b7-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase18b7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Shared constraint theorem tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_phase18b7_shared_linear_constraint_graph.py
      - name: Run Phase 18b-7 experiment
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.phase18b7_shared_linear_constraint_graph
      - name: Upload Phase 18b-7 diagnostics and results
        uses: actions/upload-artifact@v4
        with:
          name: phase18b7-results
          path: |
            minimal-predictive-lm/results/phase18b7.json
            minimal-predictive-lm/results/phase18b7.md
          retention-days: 7
