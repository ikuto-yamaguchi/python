name: minimal-predictive-lm-phase19a

on:
  pull_request:
    paths:
      - 'minimal-predictive-lm/src/minimal_predictive_lm/phase19a_general_learning_reality_gate.py'
      - 'minimal-predictive-lm/tests/test_phase19a_general_learning_reality_gate.py'
      - 'minimal-predictive-lm/docs/phase19a_general_learning_reality_gate.md'
      - '.github/workflows/minimal-predictive-lm-phase19a.yml'

concurrency:
  group: phase19a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase19a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Reality-gate theorem tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q minimal-predictive-lm/tests/test_phase19a_general_learning_reality_gate.py 2>&1 | tee phase19a-pytest.log
      - name: Run Phase 19a reality gate
        id: experiment
        continue-on-error: true
        working-directory: minimal-predictive-lm
        run: |
          set -o pipefail
          python -m minimal_predictive_lm.phase19a_general_learning_reality_gate 2>&1 | tee ../phase19a-experiment.log
      - name: Upload Phase 19a diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase19a-results
          path: |
            minimal-predictive-lm/results/phase19a.json
            minimal-predictive-lm/results/phase19a.md
            phase19a-pytest.log
            phase19a-experiment.log
          retention-days: 7
      - name: Enforce Phase 19a gate
        if: always()
        run: |
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.experiment.outcome }}" = "success"
