name: sparc-hs12-relational-plans

on:
  pull_request:
    branches: [research/minimal-compute-lm]
  workflow_dispatch:

jobs:
  hs12-relational-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit tests
        run: >-
          python -m pytest -q
          minimal-predictive-lm/tests/test_sparc_cross_domain_plans.py
          minimal-predictive-lm/tests/test_sparc_cross_domain_subject_routing.py
          minimal-predictive-lm/tests/test_sparc_relational_plans.py
      - name: Train and evaluate SPARC-HS12
        working-directory: minimal-predictive-lm
        run: |
          mkdir -p results
          python - <<'PY'
          import traceback
          from pathlib import Path
          from minimal_predictive_lm.sparc_hs12_experiment_v2 import run_experiment

          try:
              result = run_experiment()
              print(result)
          except BaseException:
              Path('results/hs12_error.txt').write_text(
                  traceback.format_exc(), encoding='utf-8'
              )
              raise
          PY
      - name: Upload model, report, or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparc-hs12-relational-plan-results
          path: minimal-predictive-lm/results
          retention-days: 14
      - name: Enforce capability and resource gates
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results/sparc_hs12_relational_plans.json').read_text())
          scale = result['large_relational_memory']
          assert result['passed'] is True
          assert result['passed_checks'] == result['total_checks'] == 12
          assert result['transformer_used'] is False
          assert result['softmax_attention_used'] is False
          assert result['growing_kv_cache_used'] is False
          assert scale['primary_subjects'] == 50000
          assert scale['episodes'] == 100000
          assert scale['indexed_relation_slots'] == 100000
          assert scale['plans'] == 1
          assert scale['schemas'] == 1
          assert scale['plan_hops'] == 2
          assert scale['correct_queries'] == scale['sample_queries'] == 512
          assert scale['max_plan_candidates'] <= 1
          assert scale['max_schema_reads'] <= 16
          assert scale['max_edge_reads'] <= 2
          assert scale['max_nodes_activated'] <= 4
          assert scale['max_estimated_operations'] <= 32
          assert scale['max_subject_substring_checks'] <= 64
          assert scale['global_node_scan_used'] is False
          assert scale['global_episode_scan_used'] is False
          assert scale['global_relation_scan_used'] is False
          assert scale['global_plan_scan_used'] is False
          assert scale['serialized_bytes'] <= 10000000
          assert result['peak_process_kib'] <= 1200000
          assert result['elapsed_seconds'] <= 120
          PY
