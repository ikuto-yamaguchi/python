name: minimal-predictive-lm-phase15b

on:
  pull_request:
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/discriminative_routing.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase15b_*.py"
      - "minimal-predictive-lm/tests/test_phase15b_*.py"
      - "minimal-predictive-lm/pyproject.toml"
      - ".github/workflows/minimal-predictive-lm-phase15b.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase15b:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Discriminative routing regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p minimal-predictive-lm/results
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase15b_discriminative_routing.py' -v 2>&1 | tee minimal-predictive-lm/results/phase15b-test.log
      - name: Upload Phase 15b diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase15b-diagnostics
          retention-days: 7
          path: minimal-predictive-lm/results/phase15b-test.log
      - name: Run discriminative routing experiment
        working-directory: minimal-predictive-lm
        run: mpm-phase15b
      - name: Upload Phase 15b result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase15b-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            minimal-predictive-lm/results/phase15b.json
            minimal-predictive-lm/results/phase15b.md
