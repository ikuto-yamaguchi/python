name: Delayed counterfactual consolidation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "minimal-predictive-lm/research/delayed_counterfactual_consolidation/**"
      - ".github/workflows/delayed-counterfactual-consolidation.yml"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: minimal-predictive-lm/research/delayed_counterfactual_consolidation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q test_delayed_counterfactual_consolidation.py
      - name: Multi-seed scaling and counterexamples
        run: |
          /usr/bin/time -v python delayed_counterfactual_consolidation.py \
            --output artifacts/delayed_counterfactual_consolidation.json \
            2> artifacts/process_resource.txt
      - uses: actions/upload-artifact@v4
        with:
          name: delayed-counterfactual-consolidation-report
          path: |
            minimal-predictive-lm/research/delayed_counterfactual_consolidation/artifacts/delayed_counterfactual_consolidation.json
            minimal-predictive-lm/research/delayed_counterfactual_consolidation/artifacts/process_resource.txt
