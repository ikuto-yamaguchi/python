name: sparc-hs10-role-induction

on:
  pull_request:
    branches: [research/minimal-compute-lm]
  workflow_dispatch:

jobs:
  hs10-role-induction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Unit tests
        run: >-
          python -m pytest -q
          minimal-predictive-lm/tests/test_sparc_discourse.py
          minimal-predictive-lm/tests/test_sparc_role_induction.py
          minimal-predictive-lm/tests/test_sparc_role_competition.py
      - name: Train and evaluate SPARC-HS10
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.sparc_hs10_experiment_v2
      - name: Upload model and report
        uses: actions/upload-artifact@v4
        with:
          name: sparc-hs10-role-induction-results
          path: minimal-predictive-lm/results
          retention-days: 14
      - name: Enforce capability and resource gates
        working-directory: minimal-predictive-lm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('results/sparc_hs10_role_induction.json').read_text())
          scale = result['large_role_induced_graph']
          assert result['passed'] is True
          assert result['passed_checks'] == result['total_checks'] == 12
          assert result['learned_roles'] == [
              'claim', 'evidence', 'example', 'counter', 'concession', 'conclusion'
          ]
          assert result['transformer_used'] is False
          assert result['softmax_attention_used'] is False
          assert result['growing_kv_cache_used'] is False
          assert result['corpus_role_scan_used'] is False
          assert scale['documents'] == 20000
          assert scale['nodes'] == 120000
          assert scale['correct_role_sequences'] == scale['sample_queries'] == 512
          assert scale['correct_summary_queries'] == scale['sample_queries'] == 512
          assert scale['max_document_candidates'] <= 1
          assert scale['max_anchor_reads'] == 0
          assert scale['max_edge_reads'] <= 4
          assert scale['max_estimated_operations'] <= 128
          assert scale['max_role_candidates'] == 7
          assert scale['max_feature_reads'] <= 5000
          assert scale['max_transition_reads'] <= 300
          assert scale['serialized_bytes'] <= 10000000
          assert result['peak_process_kib'] <= 1000000
          assert result['elapsed_seconds'] <= 120
          PY
