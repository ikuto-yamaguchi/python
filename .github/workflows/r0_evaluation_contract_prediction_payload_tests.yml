name: R0 evaluation prediction payload tests

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - '.github/workflows/r0_evaluation_contract_prediction_payload_tests.yml'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_prediction_payload.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prediction-payload-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile contract and regression test
        run: |
          python -m py_compile \
            research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py \
            research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_prediction_payload.py
      - name: Run prediction payload regression tests
        working-directory: research/intelligence_swarm/benchmarks/grounded_causal
        run: python -m unittest -v test_evaluation_contract_prediction_payload.py
