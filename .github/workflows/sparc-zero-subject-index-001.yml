name: sparc-zero-subject-index-001

on:
  pull_request:
    branches: [research/minimal-compute-lm]
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_zero_subject_index.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/sparc_zero_subject_index_gate.py"
      - "minimal-predictive-lm/tests/test_sparc_zero_subject_index.py"
      - ".github/workflows/sparc-zero-subject-index-001.yml"
  workflow_dispatch:

jobs:
  sparse-zero-subject-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Unit tests
        run: python -m unittest discover -s minimal-predictive-lm/tests -p 'test_sparc_zero_subject_index.py' -v
      - name: Run frozen sparse-index gate
        run: python -m minimal_predictive_lm.sparc_zero_subject_index_gate --output-dir artifacts/sparc-zero-subject-index-001
      - name: Upload results or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparc-zero-subject-index-001-results
          path: artifacts/sparc-zero-subject-index-001
          retention-days: 90
      - name: Enforce gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/sparc-zero-subject-index-001/SPARC-zero-subject-index-001.json").read_text())
          if not report["passed"]:
              raise SystemExit("sparse zero-subject index gate failed")
          PY
