name: minimal-predictive-lm-phase18b4

on:
  pull_request:
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase18b4_*.py"
      - "minimal-predictive-lm/tests/test_phase18b4_*.py"
      - "minimal-predictive-lm/docs/phase18b4_*.md"
      - ".github/workflows/minimal-predictive-lm-phase18b4.yml"
  push:
    branches: [main]
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase18b4_*.py"
      - "minimal-predictive-lm/tests/test_phase18b4_*.py"
      - "minimal-predictive-lm/docs/phase18b4_*.md"
      - ".github/workflows/minimal-predictive-lm-phase18b4.yml"
  workflow_dispatch:

concurrency:
  group: phase18b4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase18b4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e minimal-predictive-lm pytest
      - name: Two-variable linear-system theorem tests
        run: python -m pytest -q minimal-predictive-lm/tests/test_phase18b4_two_variable_linear_systems.py
      - name: Run Phase 18b-4 experiment
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.phase18b4_two_variable_linear_systems
      - name: Upload Phase 18b-4 diagnostics and results
        uses: actions/upload-artifact@v4
        with:
          name: phase18b4-results
          path: |
            minimal-predictive-lm/results/phase18b4.json
            minimal-predictive-lm/results/phase18b4.md
          retention-days: 7
