name: Interference-bounded consolidation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "minimal-predictive-lm/reproductions/interference_bounded_consolidation/**"
      - ".github/workflows/interference-bounded-consolidation.yml"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: minimal-predictive-lm/reproductions/interference_bounded_consolidation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy pytest
      - name: Unit tests
        env:
          PYTHONHASHSEED: "random"
        run: python -m pytest -q
      - name: Multi-seed scaling experiment
        run: python interference_bounded_consolidation.py --output artifacts/interference_bounded_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: interference-bounded-consolidation-report
          path: minimal-predictive-lm/reproductions/interference_bounded_consolidation/artifacts/interference_bounded_report.json
