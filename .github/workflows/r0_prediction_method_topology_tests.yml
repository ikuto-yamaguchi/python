name: R0 prediction method topology tests

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - 'research/intelligence_swarm/benchmarks/grounded_causal/audit_prediction_method_topology.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/test_audit_prediction_method_topology.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py'
      - '.github/workflows/r0_prediction_method_topology_tests.yml'
  pull_request:
    paths:
      - 'research/intelligence_swarm/benchmarks/grounded_causal/audit_prediction_method_topology.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/test_audit_prediction_method_topology.py'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py'
      - '.github/workflows/r0_prediction_method_topology_tests.yml'
  workflow_dispatch:

jobs:
  prediction-method-topology:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile auditor and contract
        run: |
          python -m py_compile \
            research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py \
            research/intelligence_swarm/benchmarks/grounded_causal/audit_prediction_method_topology.py \
            research/intelligence_swarm/benchmarks/grounded_causal/test_audit_prediction_method_topology.py
      - name: Run regression tests
        working-directory: research/intelligence_swarm/benchmarks/grounded_causal
        run: python -m unittest -v test_audit_prediction_method_topology.py
