name: minimal-predictive-lm-phase15c

on:
  pull_request:
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/generic_state_machine.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase15c_*.py"
      - "minimal-predictive-lm/tests/test_phase15c_*.py"
      - "minimal-predictive-lm/pyproject.toml"
      - ".github/workflows/minimal-predictive-lm-phase15c.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase15c:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Shared state runtime regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p minimal-predictive-lm/results
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase15c_generic_state_machine.py' -v 2>&1 | tee minimal-predictive-lm/results/phase15c-test.log
      - name: Upload Phase 15c diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase15c-diagnostics
          retention-days: 7
          path: minimal-predictive-lm/results/phase15c-test.log
      - name: Run shared state runtime public experiment
        working-directory: minimal-predictive-lm
        run: mpm-phase15c
      - name: Upload Phase 15c result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase15c-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            minimal-predictive-lm/results/phase15c.json
            minimal-predictive-lm/results/phase15c.md
