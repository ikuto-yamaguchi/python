name: R0D Cycle 078 shuffle value binding

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - research/intelligence_swarm/governance/apply_r0d_cycle_078_shuffle_value_binding.py
      - research/intelligence_swarm/governance/test_evaluation_contract_shuffle_value_binding_cycle_078.py
      - research/intelligence_swarm/governance/cycle_078_trigger.txt
      - .github/workflows/r0d_cycle_078_shuffle_value_binding.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/intelligence-swarm-reconstruction-001
          fetch-depth: 0
      - name: Apply fail-closed core patch
        run: python research/intelligence_swarm/governance/apply_r0d_cycle_078_shuffle_value_binding.py
      - name: Compile
        run: python -m py_compile research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py research/intelligence_swarm/governance/test_evaluation_contract_shuffle_value_binding_cycle_078.py
      - name: Focused regression
        run: python research/intelligence_swarm/governance/test_evaluation_contract_shuffle_value_binding_cycle_078.py
      - name: Commit to canonical branch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py research/intelligence_swarm/governance/REPORT_R0D_CYCLE_078.md
          git commit -m "r0d: bind shuffle predictions to donor gold values"
          git push origin HEAD:research/intelligence-swarm-reconstruction-001
