name: R0 SILG push-run locator

on:
  pull_request:
    branches:
      - research/intelligence-swarm-governance-014
    paths:
      - '.github/workflows/r0_silg_rtfm_run_locator.yml'
      - 'research/intelligence_swarm/benchmarks/grounded_causal/R01_RUN_REQUEST.json'
      - '.github/workflows/r0_silg_rtfm_probe.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  locate-latest-push-run:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Query latest canonical push runs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: research/intelligence-swarm-reconstruction-001
          WORKFLOW: r0_silg_rtfm_probe.yml
        run: |
          set -euo pipefail
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${REPO}/actions/workflows/${WORKFLOW}/runs" \
            -f branch="${BRANCH}" -f event=push -f per_page=10 \
            > r0_silg_push_runs.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('r0_silg_push_runs.json').read_text(encoding='utf-8'))
          runs = payload.get('workflow_runs', [])
          summary = []
          for run in runs:
              summary.append({
                  'id': run.get('id'),
                  'run_number': run.get('run_number'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'event': run.get('event'),
                  'head_sha': run.get('head_sha'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
                  'html_url': run.get('html_url'),
              })
          Path('r0_silg_push_run_summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if not summary:
              raise SystemExit('No push-triggered R0 SILG workflow run was found')
          print(f"LATEST_R0_SILG_PUSH_RUN_ID={summary[0]['id']}")
          PY
          latest_id=$(python -c "import json; print(json.load(open('r0_silg_push_run_summary.json'))[0]['id'])")
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${REPO}/actions/runs/${latest_id}/jobs" \
            > r0_silg_latest_jobs.json
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${REPO}/actions/runs/${latest_id}/artifacts" \
            > r0_silg_latest_artifacts.json
          python - <<'PY'
          import json
          for path in ('r0_silg_latest_jobs.json', 'r0_silg_latest_artifacts.json'):
              print(f'--- {path} ---')
              print(json.dumps(json.load(open(path)), ensure_ascii=False, indent=2))
          PY
      - name: Upload locator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0-silg-push-run-locator-${{ github.run_id }}
          path: |
            r0_silg_push_runs.json
            r0_silg_push_run_summary.json
            r0_silg_latest_jobs.json
            r0_silg_latest_artifacts.json
          if-no-files-found: warn
          retention-days: 30
