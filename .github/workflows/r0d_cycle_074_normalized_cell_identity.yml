name: R0D Cycle 074 normalized cell identity

on:
  push:
    branches:
      - research/intelligence-swarm-reconstruction-001
    paths:
      - research/intelligence_swarm/benchmarks/grounded_causal/apply_r0d_cycle_074_normalized_cell_identity.py
      - research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_normalized_cell_identity_cycle_074.py
      - .github/workflows/r0d_cycle_074_normalized_cell_identity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/intelligence-swarm-reconstruction-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact fail-closed core patch
        run: python research/intelligence_swarm/benchmarks/grounded_causal/apply_r0d_cycle_074_normalized_cell_identity.py
      - name: Compile core and regression
        run: |
          python -m py_compile research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py
          python -m py_compile research/intelligence_swarm/benchmarks/grounded_causal/test_evaluation_contract_normalized_cell_identity_cycle_074.py
      - name: Run focused regression
        working-directory: research/intelligence_swarm/benchmarks/grounded_causal
        run: python test_evaluation_contract_normalized_cell_identity_cycle_074.py
      - name: Write audit report
        run: |
          cat > research/intelligence_swarm/governance/REPORT_R0D_CYCLE_074.md <<'EOF'
          # R0-D Cycle 074 — normalized cell identity core integration

          `evaluation_contract.py` now canonicalizes domain and condition labels before
          dataset topology, shuffle donor checks, score grouping, instance fingerprints,
          confidence intervals and paired tests. Unicode width/case, whitespace and
          condition token order/delimiter aliases cannot create separate evidence cells.

          Distinct raw labels that collapse to the same canonical label are rejected
          fail-closed. Any failure remains classified as `initial_reproduction_failure`.
          EOF
      - name: Commit to the same canonical branch
        run: |
          if git diff --quiet; then
            echo 'No core change required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/intelligence_swarm/benchmarks/grounded_causal/evaluation_contract.py research/intelligence_swarm/governance/REPORT_R0D_CYCLE_074.md
          git commit -m 'r0d cycle 074: normalize domain and condition cell identity'
          git push origin HEAD:research/intelligence-swarm-reconstruction-001
