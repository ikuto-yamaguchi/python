name: minimal-predictive-lm-phase18b2

on:
  pull_request:
    paths:
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase18a7_*.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase18b1_*.py"
      - "minimal-predictive-lm/src/minimal_predictive_lm/phase18b2_*.py"
      - "minimal-predictive-lm/tests/test_phase18b2_*.py"
      - "minimal-predictive-lm/docs/phase18b2_*.md"
      - ".github/workflows/minimal-predictive-lm-phase18b2.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase18b2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: minimal-predictive-lm/pyproject.toml
      - name: Install
        run: python -m pip install -e minimal-predictive-lm
      - name: Integer operation induction theorem tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p minimal-predictive-lm/results
          python -m unittest discover -s minimal-predictive-lm/tests -p 'test_phase18b2_induced_integer_operations.py' -v 2>&1 | tee minimal-predictive-lm/results/phase18b2-test.log
      - name: Run Phase 18b-2 experiment
        working-directory: minimal-predictive-lm
        run: python -m minimal_predictive_lm.phase18b2_induced_integer_operations
      - name: Upload Phase 18b-2 diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18b2-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            minimal-predictive-lm/results/phase18b2-test.log
            minimal-predictive-lm/results/phase18b2.json
            minimal-predictive-lm/results/phase18b2.md
