[project]
name = "mneme"
version = "0.1.0"
description = "MNEME: tokenizer-free, memory-native specialized intelligence architecture (research prototype)"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mneme"]
